<HR>


<div id="form_area">※既存のjson.jsファイルを読み込みフォーム形式で表示※</div>
<div id="savebutton_area">※保存ボタンを表示※</div>
<div id="message_area">※警告メッセージなどを表示※</div>
<textarea id="json_area" cols="80" rows="10">※新規のjson.js情報※</textarea>

<script>

// ストレージの定義
const storage = localStorage;

// 項目-群
const itemDefinitions = [
  {"item": "aicon"   , "line_flg": 0, "mustFlg": "OPTION"},
  {"item": "kana"    , "line_flg": 0, "mustFlg": "MUST"},
  {"item": "Name"    , "line_flg": 0, "mustFlg": "MUST"},
  {"item": "URL"     , "line_flg": 0, "mustFlg": "MUST"},
  {"item": "category", "line_flg": 1, "mustFlg": "MUST"},
  {"item": "note"    , "line_flg": 2, "mustFlg": "OPTION"},
];

// json.js の info 情報
let infoSection = "";
// formタグの情報を格納
wStr = ""

// 更新対象のjson.jsファイル
let currentListKey = "";
let listExpression = "";  // list 情報
let infoExpression = "";  // info 情報

const jsFileNames = new Array();
jsFileNames["list01"] = "links_01.json.js";
jsFileNames["list02"] = "links_02.json.js";
jsFileNames["list03"] = "links_03.json.js";
jsFileNames["list04"] = "links_04.json.js";
jsFileNames["list05"] = "links_05.json.js";
jsFileNames["list06"] = "links_06.json.js";
jsFileNames["list07"] = "links_07.json.js";
jsFileNames["list08"] = "links_08.json.js";
jsFileNames["list09"] = "links_09.json.js";
jsFileNames["list10"] = "links_10.json.js";
jsFileNames["function_enhancement.js"] = "function_enhancement.js";

// 更新対象のjson.js変数
let targetList = "";
let targetInfo = "";


function set_form_cell(formFlg, lineFlg, element, itemValue, mustFlag){
  // 1項目の入力フォームを作る
  let fieldHtml = "";
  //fieldHtml+= "<div>";
  fieldHtml+= '<label for="'+element+'">'+element+'</label>';
  if(lineFlg == 0){
    fieldHtml+= '<input type="text" id="'+element+'" name="'+element+'" value="'+ itemValue +'" size="100%" >';
  }else if(lineFlg == 1){
    fieldHtml+= '<textarea id="'+element+'" name="'+element+'" cols="50" rows="7">'+ itemValue +'</textarea>';
  }else{
    fieldHtml+= '<textarea id="'+element+'" name="'+element+'" cols="100%" rows="5">'+ itemValue +'</textarea>';
  }
  //fieldHtml+= '</div>';

  if(mustFlag=="MUST"){
    fieldHtml = "<font color='red'>" +fieldHtml+ "</font>";
  }

  return(fieldHtml);
}

function set_form_flow(itemDefinitions, listItem){
  // 指定データをもとにフォームを作る。指定データがなければ値は空になる
  let formHtml = "";
  let itemValue = "";
  let categoryText = "";
  for (const elem in itemDefinitions) {
    let formFlg = 1;
    let lineFlg = Number(itemDefinitions[elem]["line_flg"]);
    let itemName = itemDefinitions[elem]["item"];
    let mustFlag  = itemDefinitions[elem]["mustFlg"];

    let itemNo = Number(elem) + 1;
    if(elem == 0){
      formFlg = 0;
    }else if(itemNo == itemDefinitions.length){
      formFlg = -1;
    }

    itemValue = listItem[itemName];

    if (typeof itemValue === "undefined"){
      itemValue = "";
    }else  if (typeof itemValue === "object"){
      categoryText = "";
      for(const cell in itemValue){
        if (itemValue[cell]["key"] != ""){
          categoryText += '"'+itemValue[cell]["key"]+'": "'+itemValue[cell]["kana"] + '"\n';
        }
      }
      categoryText = categoryText.trim();  // 最後の改行コードを削除
      itemValue = categoryText;
    }
    //formHtml += "<div class='div_f2'>";
    //console.log( "DEBUG " + itemName +", "+ mustFlag);
    formHtml += set_form_cell(formFlg, lineFlg, itemName, itemValue, mustFlag);
    formHtml += "<BR />";
    //formHtml += "</div>";
  }
  return(formHtml);
}


function make_data_to_jsformat(){
  let generatedJs = "";
  let listSection = "";
  let currentItemOutput = "";
  let shouldWrite = true;
  let fieldName = "";
  let fieldValue= "";
  let warningMessage = "";  // category欄に undefined があった場合に警告を出す
  let warningMessageCell = "";

  // フォームの情報を取得
  const formElements = document.forms.linklist;

  for(let formIndex = 0; formIndex < formElements.length; formIndex++){
    fieldName = formElements.elements.item(formIndex).name;
    fieldValue= formElements.elements.item(formIndex).value;

    switch (fieldName){
      case "aicon":
        currentItemOutput += "{\n";
        if(fieldValue != ""){
          currentItemOutput +=  '\t"'+ fieldName +'": "'+ fieldValue +'",\n';
        }
        break;
      case "kana":
        currentItemOutput +=  '\t"'+ fieldName +'": "'+ fieldValue +'",\n';
        break;
      case "Name":
        currentItemOutput +=  '\t"'+ fieldName +'": "'+ fieldValue +'",\n';
        if(fieldValue == "") shouldWrite = false;
        break;
      case "URL":
        currentItemOutput +=  '\t"'+ fieldName +'": "'+ fieldValue +'",\n';
        break;
      case "category":
        let categoryOutput = set_category_out(fieldValue);

        if(categoryOutput.indexOf('undefined') > 0){
          warningMessageCell += "category欄に undefined が含まれています [" + categoryOutput + "]<BR />";
        }

        currentItemOutput += '\t"'+ fieldName +'":\n';
        currentItemOutput += '\t\t[\n';
        currentItemOutput += '\t\t\t' + categoryOutput + '\n';
        currentItemOutput += '\t\t],\n';
        break;
      case "note":
        fieldValue = fieldValue.replace(/\n/g, '\\n')
        currentItemOutput +=  '\t"'+ fieldName +'": "'+ fieldValue +'"\n';
        currentItemOutput += "},";
        if(shouldWrite){
          // 新json.jsファイルに追記する情報
          listSection += currentItemOutput;
          warningMessage += warningMessageCell;
        }
        currentItemOutput = "";
        shouldWrite = true;
        warningMessageCell = "";
        break;
    }
  }
  listSection = '"list": [\n' + listSection + "\n]";
  generatedJs += "let " + currentListKey + " = {\n";
  generatedJs += infoSection + ",\n";
  generatedJs += listSection;
  generatedJs += "};";

  document.getElementById("json_area").innerHTML = generatedJs;
  document.getElementById("message_area").innerHTML = '<font color="red">' + warningMessage + "</font>";

  let text = document.getElementById("json_area");
  text.select();
  document.execCommand("copy");
  document.getElementById("savebutton_area").innerHTML = "<input type='button' value='ファイル出力' onclick='outputText();' />";
}


function make_data_to_jsformat_etc(){
  let fieldName = "";
  let fieldValue = "";

  // フォームの情報を取得
  const formElements = document.forms.linklist;

  for(let formIndex = 0; formIndex < formElements.length; formIndex++){
    fieldName = formElements.elements.item(formIndex).name;
    fieldValue= formElements.elements.item(formIndex).value;
  }

  document.getElementById("json_area").innerHTML = fieldValue;

  let text = document.getElementById("json_area");
  text.select();
  document.execCommand("copy");
  document.getElementById("savebutton_area").innerHTML = "<input type='button' value='ファイル出力' onclick='outputText();' />";
}


function set_category_out(categoryInput){
  let categoryLinesOutput = "";
  const categoryLines = categoryInput.split("\n")

  for(const line in categoryLines){
    const categoryParts = categoryLines[line].split('"');
    const categoryKey = categoryParts[1];
    let categoryKana = categoryParts[3];
    if (typeof categoryKana !== "undefined"){
      const firstKanaChar = categoryKana[0];  // 1文字目を取得
      const normalizedFirstKanaChar = firstKanaChar.normalize('NFD')[0];  // 濁音→静音に変換
      categoryKana = categoryKana.replace(firstKanaChar, normalizedFirstKanaChar);
    }
    categoryLinesOutput += '\t\t\t{ "key": "' + categoryKey + '", "kana": "' + categoryKana +'"},\n';
  }
  categoryLinesOutput = categoryLinesOutput.trim();  // 最後の改行コードを削除
  categoryLinesOutput = categoryLinesOutput.slice(0, -1);  // 最後の文字 ,(コロン)を削除
  return(categoryLinesOutput);
}


function set_init(){
  document.getElementById("form_area").innerHTML = "";
  document.getElementById("message_area").innerHTML = "";
  document.getElementById("json_area").innerHTML = "";
  wStr = "";
  listExpression = "";
  infoExpression = "";
  infoSection = "";
  document.getElementById("savebutton_area").innerHTML = "";  // ファイル出力ボタンを消す
}


function root_flow(selectedListKey){
  set_init();  // 初期値設定
  currentListKey = selectedListKey;
  wStr += '<form name="linklist" action="" onsubmit="">'

  switch (selectedListKey){
    case "list01": listExpression = 'list01["list"]'; infoExpression = 'list01["info"]'; break;
    case "list02": listExpression = 'list02["list"]'; infoExpression = 'list02["info"]'; break;
    case "list03": listExpression = 'list03["list"]'; infoExpression = 'list03["info"]'; break;
    case "list04": listExpression = 'list04["list"]'; infoExpression = 'list04["info"]'; break;
    case "list05": listExpression = 'list05["list"]'; infoExpression = 'list05["info"]'; break;
    case "list06": listExpression = 'list06["list"]'; infoExpression = 'list06["info"]'; break;
    case "list07": listExpression = 'list07["list"]'; infoExpression = 'list07["info"]'; break;
    case "list08": listExpression = 'list08["list"]'; infoExpression = 'list08["info"]'; break;
    case "list09": listExpression = 'list09["list"]'; infoExpression = 'list09["info"]'; break;
    case "list10": listExpression = 'list10["list"]'; infoExpression = 'list10["info"]'; break;
  }

  targetList = eval(listExpression);
  targetInfo = eval(infoExpression);

  infoSection += '"info": {"Title":"' + targetInfo["Title"] + '","ID":"' + targetInfo["ID"] + '","NOTE":"' + targetInfo["NOTE"] + '"}';

  for (const elem in targetList) {
    // jsonデータを設定値にしてフォームを作る
    wStr += set_form_flow(itemDefinitions,targetList[elem]);
    wStr += "<HR />";
  }

  // 新規登録用のフォーム枠を作る数を取得する
  //const LPMAX = Number(document.getElementById("number_of_blank_cells").value);
  const LPMAX = 3;
  
  for(let step = 0; step < LPMAX; step++) {
    // 各値が空白のフォームを作る
    wStr += set_form_flow(itemDefinitions, "NONE");
    wStr += "<HR />";
  }

  wStr += '</form>';
  wStr += '<input type="button" value="jsファイル作成" onclick="make_data_to_jsformat();" />';

  document.getElementById("form_area").innerHTML = wStr;
}

function outputText(){
  // 作成したリンク集をファイル出力する
  let fileContent = "";
  fileContent += document.getElementById("json_area").value;
  let fileContentChars = fileContent.split(''); // 配列形式に変換（後述のBlobで全要素出力）
  let blob = new Blob(fileContentChars,{type:"text/plain"}); // テキスト形式でBlob定義
  let link = document.createElement('a'); // HTMLのaタグを作成
  link.href = URL.createObjectURL(blob); // aタグのhref属性を作成
  link.download = jsFileNames[currentListKey]; // aタグのdownload属性を作成
  link.click(); // 定義したaタグをクリック（実行）
}


function etc_flow(selectedFileKey){
  // function_enhancement.js を編集する
  currentListKey = selectedFileKey;
  wStr = "";
  let enhancementSource = "";
  set_init();  // 初期値設定

  enhancementSource += `const key_highlight = [];\n`;
  enhancementSource += `const targetDateList = [];\n`;
  enhancementSource += `const targetWeekList = [];\n`;
  enhancementSource += `const key_aicon = [];\n`;

  enhancementSource += `\n// ----- カテゴリキーに背景色を設定する ----- //\n`;
  for (let key in key_highlight) {
    let vInfo = key_highlight[key];
    enhancementSource += `key_highlight["${key}"] = "${vInfo}";\n`;
  }

  enhancementSource += `\n// ----- アイコンボタン：検索キーの簡易登録 ----- //\n`;
  for (let key in key_aicon) {
    let vInfo = key_aicon[key];
    enhancementSource += `key_aicon["${key}"] = "${vInfo}";\n`;
  }

  enhancementSource += `\n// ----- イベント：年・月・日 指定 ----- //\n`;
  for (let key in targetDateList) {
    let vDate = targetDateList[key][0];
    let vAicon = targetDateList[key][1];
    let vInfo = targetDateList[key][2];
    enhancementSource += `targetDateList.push(["${vDate}","${vAicon}","${vInfo}"]);\n`;
  }

  enhancementSource += `\n// ----- イベント：曜日 指定 ----- //\n`;
  for (let key in targetWeekList) {
    let vDate = targetWeekList[key][0];
    let vAicon = targetWeekList[key][1];
    let vInfo = targetWeekList[key][2];
    enhancementSource += `targetWeekList.push(["${vDate}","${vAicon}","${vInfo}"]);\n`;
  }

  wStr += `<form name="linklist" action="" onsubmit="">`;
  wStr += `<textarea id="function_enhancement_id" name="function_enhancement_name" cols="250" rows="50">${enhancementSource}</textarea>`;
  wStr += `</form>`;
  wStr += `<input type="button" value="jsファイル作成" onclick="make_data_to_jsformat_etc();" />`;

  document.getElementById("form_area").innerHTML = wStr;
}




// ----------------------------------- //
// ROOT FLOW

set_init();  // 初期値設定

</script>
