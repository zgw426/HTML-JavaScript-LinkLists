<div id="link_list_buttons"></div>
<div id="link_storage_area">※Web StorageのJSON情報を表示※</div>

<div id="form_area">※Web Storageのリンク情報をフォーム形式で表示※</div>

<div id="message_area">※警告メッセージなどを表示※</div>

<script>

// ストレージの定義
const storage = localStorage;
const LINK_STORAGE_PREFIX = "HTML-JavaScript-LinkLists.links.";
const LINK_VISIBILITY_STORAGE_KEY = "HTML-JavaScript-LinkLists.visibleLinkIds";
const AREA_B_VISIBILITY_STORAGE_KEY = "HTML-JavaScript-LinkLists.areaBVisibleLinkIds";
const ENHANCEMENT_STORAGE_KEY = "HTML-JavaScript-LinkLists.functionEnhancement";
const OPERATION_LOG_STORAGE_KEY = "HTML-JavaScript-LinkLists.operationLog";
const DEFAULT_ORIGINAL_ID = "HTML-JavaScript-LinkLists";
const DEFAULT_OPERATION_LOG_MAX = 100;
const linkListKeys = Array.from({length: 99}, (_, index) => "list" + String(index + 1).padStart(2, "0"));

function getLinkStorageKey(listKey){
  return LINK_STORAGE_PREFIX + listKey;
}

function normalizeLinkInfoId(infoId){
  const numberInfoId = Number(infoId);
  return Number.isFinite(numberInfoId) ? numberInfoId : infoId;
}

function normalizeLinkInfoIds(linkInfoIds){
  return linkInfoIds.map(infoId => normalizeLinkInfoId(infoId));
}

function renderLinkListButtons(){
  let buttonsHtml = "";
  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const linkNumber = String(keyIndex + 1).padStart(2, "0");
    buttonsHtml += '<input type="button" value="links_' + linkNumber + '" onclick=\'root_flow("' + linkListKeys[keyIndex] + '");\' />';
  }
  document.getElementById("link_list_buttons").innerHTML = buttonsHtml;
}

function isValidLinkData(linkData){
  return linkData
    && typeof linkData === "object"
    && linkData["info"]
    && typeof linkData["info"]["ID"] !== "undefined"
    && Array.isArray(linkData["list"]);
}

function getLinkDataFromStorage(listKey){
  const storedValue = storage.getItem(getLinkStorageKey(listKey));
  if(storedValue == null) return null;
  try {
    const linkData = JSON.parse(storedValue);
    if(!isValidLinkData(linkData)) return null;
    linkData["info"]["ID"] = normalizeLinkInfoId(linkData["info"]["ID"]);
    return linkData;
  } catch (error) {
    console.warn("Invalid link data in Web Storage:", listKey, error);
    return null;
  }
}

function setLinkDataToStorage(listKey, linkData){
  storage.setItem(getLinkStorageKey(listKey), JSON.stringify(linkData));
}

function isValidEnhancementData(enhancementData){
  return enhancementData
    && typeof enhancementData === "object"
    && enhancementData["key_highlight"]
    && typeof enhancementData["key_highlight"] === "object"
    && enhancementData["key_icon"]
    && typeof enhancementData["key_icon"] === "object"
    && Array.isArray(enhancementData["targetDateList"])
    && Array.isArray(enhancementData["targetWeekList"]);
}

function getValidatedOriginalId(value){
  const originalIdValue = String(value == null ? "" : value).trim();
  return originalIdValue == "" ? DEFAULT_ORIGINAL_ID : originalIdValue;
}

function getValidatedOperationLogMax(value){
  const operationLogMax = Number(value);
  if(Number.isFinite(operationLogMax) && operationLogMax >= 0){
    return Math.floor(operationLogMax);
  }

  return DEFAULT_OPERATION_LOG_MAX;
}

function getOperationLogMax(){
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    return DEFAULT_OPERATION_LOG_MAX;
  }

  return getValidatedOperationLogMax(enhancementData["operationLogMax"]);
}

function getOriginalId(){
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    return DEFAULT_ORIGINAL_ID;
  }

  return getValidatedOriginalId(enhancementData["originalId"]);
}

function getOperationLogs(){
  const storedValue = storage.getItem(OPERATION_LOG_STORAGE_KEY);
  if(storedValue == null){
    return [];
  }

  try {
    const operationLogs = JSON.parse(storedValue);
    return Array.isArray(operationLogs) ? operationLogs : [];
  } catch (error) {
    console.warn("Invalid operation log data in Web Storage:", error);
    return [];
  }
}

function saveOperationLogs(operationLogs){
  const operationLogMax = getOperationLogMax();
  const trimmedLogs = operationLogMax == 0
    ? []
    : operationLogs.slice(Math.max(operationLogs.length - operationLogMax, 0));
  storage.setItem(OPERATION_LOG_STORAGE_KEY, JSON.stringify(trimmedLogs));
}

function getWeekdayText(date){
  return ["日","月","火","水","木","金","土"][date.getDay()];
}

function getLocaleDateTimeText(date){
  return date.toLocaleString();
}

function recordOperationLog(action, detail){
  const logDate = new Date();
  const operationLogs = getOperationLogs();
  operationLogs.push({
    "utcDateTime": logDate.toISOString(),
    "localeDateTime": getLocaleDateTimeText(logDate),
    "weekday": getWeekdayText(logDate),
    "originalId": getOriginalId(),
    "action": action,
    "detail": detail
  });
  saveOperationLogs(operationLogs);
}

function getEnhancementDataFromStorage(){
  const storedValue = storage.getItem(ENHANCEMENT_STORAGE_KEY);
  if(storedValue == null) return null;
  try {
    const enhancementData = JSON.parse(storedValue);
    return isValidEnhancementData(enhancementData) ? enhancementData : null;
  } catch (error) {
    console.warn("Invalid function enhancement data in Web Storage:", error);
    return null;
  }
}

function setEnhancementDataToStorage(enhancementData){
  enhancementData["type"] = "function_enhancement";
  enhancementData["originalId"] = getValidatedOriginalId(enhancementData["originalId"]);
  enhancementData["operationLogMax"] = getValidatedOperationLogMax(enhancementData["operationLogMax"]);
  storage.setItem(ENHANCEMENT_STORAGE_KEY, JSON.stringify(enhancementData));
  saveOperationLogs(getOperationLogs());
}

function deleteEnhancementDataFromStorage(){
  storage.removeItem(ENHANCEMENT_STORAGE_KEY);
}

function makeJsonFileName(listData){
  return "links_" + String(listData["info"]["ID"]).padStart(2, "0") + ".json";
}

function makeEnhancementJsonFileName(){
  return "function_enhancement.json";
}

function downloadTextFile(fileName, fileContent, contentType){
  const blob = new Blob([fileContent], {type: contentType});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportStoredLinkData(listKey){
  const linkData = getLinkDataFromStorage(listKey);
  if(linkData == null){
    return;
  }
  const fileName = makeJsonFileName(linkData);
  downloadTextFile(fileName, JSON.stringify(linkData, null, 2), "application/json");
  recordOperationLog("JSON出力", fileName);
}

function exportStoredEnhancementData(){
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    return;
  }
  const fileName = makeEnhancementJsonFileName();
  downloadTextFile(fileName, JSON.stringify(enhancementData, null, 2), "application/json");
  recordOperationLog("JSON出力", fileName);
}

function deleteLinkDataFromStorage(listKey){
  storage.removeItem(getLinkStorageKey(listKey));
}

function getAllLinkInfoIds(){
  const linkInfoIds = [];
  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const linkData = getLinkDataFromStorage(linkListKeys[keyIndex]);
    if(linkData != null){
      linkInfoIds.push(normalizeLinkInfoId(linkData["info"]["ID"]));
    }
  }
  return linkInfoIds;
}

function getVisibleLinkIds(){
  const allLinkInfoIds = getAllLinkInfoIds();
  const storedValue = storage.getItem(LINK_VISIBILITY_STORAGE_KEY);
  if(storedValue == null){
    return allLinkInfoIds;
  }

  try {
    const storedIds = JSON.parse(storedValue);
    return Array.isArray(storedIds)
      ? normalizeLinkInfoIds(storedIds).filter(infoId => allLinkInfoIds.includes(infoId))
      : allLinkInfoIds;
  } catch (error) {
    console.warn("Invalid visible link ids in Web Storage:", error);
    return allLinkInfoIds;
  }
}

function saveVisibleLinkIds(linkInfoIds){
  storage.setItem(LINK_VISIBILITY_STORAGE_KEY, JSON.stringify(normalizeLinkInfoIds(linkInfoIds)));
}

function getAreaBVisibleLinkIds(){
  const visibleLinkIds = getVisibleLinkIds();
  const storedValue = storage.getItem(AREA_B_VISIBILITY_STORAGE_KEY);
  if(storedValue == null){
    return visibleLinkIds;
  }

  try {
    const storedIds = JSON.parse(storedValue);
    return Array.isArray(storedIds)
      ? normalizeLinkInfoIds(storedIds).filter(infoId => visibleLinkIds.includes(infoId))
      : visibleLinkIds;
  } catch (error) {
    console.warn("Invalid AreaB visible link ids in Web Storage:", error);
    return visibleLinkIds;
  }
}

function saveAreaBVisibleLinkIds(linkInfoIds){
  const visibleLinkIds = getVisibleLinkIds();
  const normalizedLinkInfoIds = normalizeLinkInfoIds(linkInfoIds);
  storage.setItem(AREA_B_VISIBILITY_STORAGE_KEY, JSON.stringify(normalizedLinkInfoIds.filter(infoId => visibleLinkIds.includes(infoId))));
}

function addLinkInfoIdToVisibility(linkInfoId){
  const normalizedLinkInfoId = normalizeLinkInfoId(linkInfoId);
  saveVisibleLinkIds(Array.from(new Set(getVisibleLinkIds().concat([normalizedLinkInfoId]))));
  saveAreaBVisibleLinkIds(Array.from(new Set(getAreaBVisibleLinkIds().concat([normalizedLinkInfoId]))));
}

function refreshParentAreas(linkInfoId){
  try {
    if(parent && typeof parent.addLinkInfoIdToVisibility === "function" && typeof linkInfoId !== "undefined"){
      parent.addLinkInfoIdToVisibility(linkInfoId);
    }
    if(parent && typeof parent.refreshAllAreas === "function"){
      parent.refreshAllAreas();
    }
  } catch (error) {
    console.warn("Skipped parent refresh:", error);
  }
}

function refreshParentAreaB(visibleLinkIds, areaBVisibleLinkIds){
  try {
    if(parent && parent !== window && typeof parent.refreshAreaBWithVisibility === "function"){
      parent.refreshAreaBWithVisibility(visibleLinkIds, areaBVisibleLinkIds);
      return;
    }
  } catch (error) {
    console.warn("Skipped direct parent AreaB refresh:", error);
  }

  try {
    if(parent && parent !== window){
      parent.postMessage({
        "type": "HTML-JavaScript-LinkLists.refreshAreaB",
        "visibleLinkIds": visibleLinkIds,
        "areaBVisibleLinkIds": areaBVisibleLinkIds
      }, "*");
    }
  } catch (error) {
    console.warn("Skipped parent AreaB refresh message:", error);
  }
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function renderLinkStorageControls(){
  let controlsHtml = "";
  const visibleLinkIds = getVisibleLinkIds();
  const areaBVisibleLinkIds = getAreaBVisibleLinkIds();
  const enhancementData = getEnhancementDataFromStorage();

  controlsHtml += "<HR>";
  controlsHtml += "<form name='linkStorageControls'>";

  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const listKey = linkListKeys[keyIndex];
    const linkData = getLinkDataFromStorage(listKey);
    if(linkData == null){
      continue;
    }

    const linkInfo = linkData["info"];
    const linkInfoId = normalizeLinkInfoId(linkInfo["ID"]);
    const checkedAttr = visibleLinkIds.includes(linkInfoId) ? "checked='checked'" : "";
    const areaBCheckedAttr = areaBVisibleLinkIds.includes(linkInfoId) ? "checked='checked'" : "";
    const areaBDisabledAttr = visibleLinkIds.includes(linkInfoId) ? "" : "disabled='disabled'";
    controlsHtml += "<div class='div_f1'>";
    controlsHtml += "<input type='checkbox' name='visibleLinkInfoId' value='" + linkInfoId + "' onclick='updateVisibleLinksFromForm(this.name, this.value, this.checked)' " + checkedAttr + ">";
    controlsHtml += " 常時表示";
    controlsHtml += "<input type='checkbox' name='areaBVisibleLinkInfoId' value='" + linkInfoId + "' onclick='updateAreaBVisibleLinksFromForm(this.name, this.value, this.checked)' " + areaBCheckedAttr + " " + areaBDisabledAttr + ">";
    controlsHtml += " AreaB初期表示";
    controlsHtml += "<HR>";    
    controlsHtml += linkInfoId + "-" + linkInfo["Title"];
    controlsHtml += " <input type='button' value='削除' onclick='deleteStoredLinkData(\"" + listKey + "\")' />";
    controlsHtml += " <input type='button' value='JSON出力' onclick='exportStoredLinkData(\"" + listKey + "\")' />";
    controlsHtml += "<BR />　<small>" + linkInfo["NOTE"] + "</small>";

    controlsHtml += "</div>";
  }

  if(enhancementData != null){
    controlsHtml += "<div class='div_f1'>";
    controlsHtml += "<b>" + makeEnhancementJsonFileName() + "</b>";
    controlsHtml += " <input type='button' value='修正' onclick='editEnhancementData()' />";
    controlsHtml += " <input type='button' value='削除' onclick='deleteStoredEnhancementData()' />";
    controlsHtml += " <input type='button' value='JSON出力' onclick='exportStoredEnhancementData()' />";
    controlsHtml += "<BR /><small>key_highlight: " + Object.keys(enhancementData["key_highlight"]).length;
    controlsHtml += " / key_icon: " + Object.keys(enhancementData["key_icon"]).length;
    controlsHtml += " / targetDateList: " + enhancementData["targetDateList"].length;
    controlsHtml += " / targetWeekList: " + enhancementData["targetWeekList"].length + "</small>";
    controlsHtml += "</div>";
  }

  controlsHtml += "</form>";
  document.getElementById("link_storage_area").innerHTML = controlsHtml;
}

function updateVisibleLinksFromForm(controlName, changedValue, checked){
  if(typeof changedValue !== "undefined"){
    recordOperationLog("チェックボックス変更", controlName + "=" + changedValue + "____checked=" + checked);
  }
  const toElementArray = (elements) => elements == null ? [] : (typeof elements.length === "number" ? Array.from(elements) : [elements]);
  const visibleCheckboxes = toElementArray(document.linkStorageControls.visibleLinkInfoId);
  const visibleLinkInfoIds = [];

  for(let index = 0; index < visibleCheckboxes.length; index++){
    if(visibleCheckboxes[index].checked){
      visibleLinkInfoIds.push(normalizeLinkInfoId(visibleCheckboxes[index].value));
    }
  }

  saveVisibleLinkIds(visibleLinkInfoIds);
  saveAreaBVisibleLinkIds(getAreaBVisibleLinkIds());
  const latestVisibleLinkIds = getVisibleLinkIds();
  const latestAreaBVisibleLinkIds = getAreaBVisibleLinkIds();
  renderLinkStorageControls();
  refreshParentAreaB(latestVisibleLinkIds, latestAreaBVisibleLinkIds);
}

function updateAreaBVisibleLinksFromForm(controlName, changedValue, checked){
  if(typeof changedValue !== "undefined"){
    recordOperationLog("チェックボックス変更", controlName + "=" + changedValue + "____checked=" + checked);
  }
  const toElementArray = (elements) => elements == null ? [] : (typeof elements.length === "number" ? Array.from(elements) : [elements]);
  const areaBVisibleCheckboxes = toElementArray(document.linkStorageControls.areaBVisibleLinkInfoId);
  const areaBVisibleLinkInfoIds = [];

  for(let index = 0; index < areaBVisibleCheckboxes.length; index++){
    if(areaBVisibleCheckboxes[index].checked){
      areaBVisibleLinkInfoIds.push(normalizeLinkInfoId(areaBVisibleCheckboxes[index].value));
    }
  }

  saveAreaBVisibleLinkIds(areaBVisibleLinkInfoIds);
  refreshParentAreaB(getVisibleLinkIds(), getAreaBVisibleLinkIds());
}

function deleteStoredLinkData(listKey){
  const linkData = getLinkDataFromStorage(listKey);
  if(linkData == null){
    return;
  }

  const linkInfo = linkData["info"];
  if(!confirm(linkInfo["ID"] + "-" + linkInfo["Title"] + " をWeb Storageから削除しますか？")){
    return;
  }

  deleteLinkDataFromStorage(listKey);
  saveVisibleLinkIds(getVisibleLinkIds().filter(infoId => infoId != linkInfo["ID"]));
  saveAreaBVisibleLinkIds(getAreaBVisibleLinkIds().filter(infoId => infoId != linkInfo["ID"]));

  if(currentListKey == listKey){
    currentListKey = "";
    set_init();
  }

  renderLinkStorageControls();
  refreshParentAreas();
}

// 項目-群
function deleteStoredEnhancementData(){
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    return;
  }

  if(!confirm(makeEnhancementJsonFileName() + " をWeb Storageから削除しますか？")){
    return;
  }

  deleteEnhancementDataFromStorage();
  set_init();
  renderLinkStorageControls();
}

function getFormElements(formElements, fieldName){
  const elements = formElements[fieldName];
  if(elements == null){
    return [];
  }
  return typeof elements.length === "number" ? Array.from(elements) : [elements];
}

function makeInputCell(name, value, size){
  return '<input type="text" name="' + name + '" value="' + escapeHtml(value == null ? "" : value) + '" size="' + size + '" />';
}

function makeEnhancementPairRows(sourceObject, keyName, valueName, blankRowCount){
  let formHtml = "";
  for(const key in sourceObject){
    formHtml += "<tr>";
    formHtml += "<td>" + makeInputCell(keyName, key, 30) + "</td>";
    formHtml += "<td>" + makeInputCell(valueName, sourceObject[key], 40) + "</td>";
    formHtml += "</tr>";
  }

  for(let rowIndex = 0; rowIndex < blankRowCount; rowIndex++){
    formHtml += "<tr>";
    formHtml += "<td>" + makeInputCell(keyName, "", 30) + "</td>";
    formHtml += "<td>" + makeInputCell(valueName, "", 40) + "</td>";
    formHtml += "</tr>";
  }

  return formHtml;
}

function makeEnhancementListRows(sourceList, fieldNames, blankRowCount){
  let formHtml = "";
  for(let rowIndex = 0; rowIndex < sourceList.length; rowIndex++){
    formHtml += "<tr>";
    for(let cellIndex = 0; cellIndex < fieldNames.length; cellIndex++){
      const inputSize = cellIndex == fieldNames.length - 1 ? 60 : 20;
      formHtml += "<td>" + makeInputCell(fieldNames[cellIndex], sourceList[rowIndex][cellIndex], inputSize) + "</td>";
    }
    formHtml += "</tr>";
  }

  for(let rowIndex = 0; rowIndex < blankRowCount; rowIndex++){
    formHtml += "<tr>";
    for(let cellIndex = 0; cellIndex < fieldNames.length; cellIndex++){
      const inputSize = cellIndex == fieldNames.length - 1 ? 60 : 20;
      formHtml += "<td>" + makeInputCell(fieldNames[cellIndex], "", inputSize) + "</td>";
    }
    formHtml += "</tr>";
  }

  return formHtml;
}

function collectEnhancementPairs(formElements, keyName, valueName){
  const keys = getFormElements(formElements, keyName);
  const values = getFormElements(formElements, valueName);
  const result = {};

  for(let rowIndex = 0; rowIndex < keys.length; rowIndex++){
    const key = keys[rowIndex].value.trim();
    const value = values[rowIndex].value.trim();
    if(key != ""){
      result[key] = value;
    }
  }

  return result;
}

function collectEnhancementList(formElements, fieldNames){
  const fieldElementLists = fieldNames.map(fieldName => getFormElements(formElements, fieldName));
  const rowCount = fieldElementLists.length == 0 ? 0 : fieldElementLists[0].length;
  const result = [];

  for(let rowIndex = 0; rowIndex < rowCount; rowIndex++){
    const row = fieldElementLists.map(elements => elements[rowIndex].value.trim());
    if(row.some(value => value != "")){
      result.push(row);
    }
  }

  return result;
}

function updateEnhancementStorageFromForm(){
  const formElements = document.forms.enhancementDataForm;
  const enhancementData = {
    "type": "function_enhancement",
    "key_highlight": collectEnhancementPairs(formElements, "highlightKey", "highlightColor"),
    "key_icon": collectEnhancementPairs(formElements, "iconFile", "iconKeyword"),
    "targetDateList": collectEnhancementList(formElements, ["targetDate", "targetDateIcon", "targetDateText"]),
    "targetWeekList": collectEnhancementList(formElements, ["targetWeek", "targetWeekIcon", "targetWeekText"]),
    "originalId": getValidatedOriginalId(formElements.originalId.value),
    "operationLogMax": getValidatedOperationLogMax(formElements.operationLogMax.value)
  };

  try {
    setEnhancementDataToStorage(enhancementData);
    renderLinkStorageControls();
    refreshParentAreas();
    document.getElementById("message_area").innerHTML = "更新しました";
  } catch (error) {
    console.error("Failed to update function enhancement data:", error);
    document.getElementById("message_area").innerHTML = '<font color="red">エラーが発生し更新できませんでした</font>';
  }
}

function editEnhancementData(){
  set_init();
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    document.getElementById("message_area").innerHTML = "Web Storage に " + makeEnhancementJsonFileName() + " がありません。";
    return;
  }

  let formHtml = "";
  formHtml += '<form name="enhancementDataForm" action="" onsubmit="">';
  formHtml += "<h3>" + makeEnhancementJsonFileName() + "</h3>";
  formHtml += "<h4>originalId</h4>";
  formHtml += makeInputCell("originalId", getValidatedOriginalId(enhancementData["originalId"]), 40);
  formHtml += "<h4>operationLogMax</h4>";
  formHtml += makeInputCell("operationLogMax", getValidatedOperationLogMax(enhancementData["operationLogMax"]), 10);

  formHtml += "<h4>key_highlight</h4>";
  formHtml += "<table><tr><th>キーワード</th><th>色</th></tr>";
  formHtml += makeEnhancementPairRows(enhancementData["key_highlight"], "highlightKey", "highlightColor", 3);
  formHtml += "</table>";

  formHtml += "<h4>key_icon</h4>";
  formHtml += "<table><tr><th>アイコン</th><th>キーワード</th></tr>";
  formHtml += makeEnhancementPairRows(enhancementData["key_icon"], "iconFile", "iconKeyword", 3);
  formHtml += "</table>";

  formHtml += "<h4>targetDateList</h4>";
  formHtml += "<table><tr><th>日付</th><th>アイコン</th><th>テキスト</th></tr>";
  formHtml += makeEnhancementListRows(enhancementData["targetDateList"], ["targetDate", "targetDateIcon", "targetDateText"], 3);
  formHtml += "</table>";

  formHtml += "<h4>targetWeekList</h4>";
  formHtml += "<table><tr><th>曜日</th><th>アイコン</th><th>テキスト</th></tr>";
  formHtml += makeEnhancementListRows(enhancementData["targetWeekList"], ["targetWeek", "targetWeekIcon", "targetWeekText"], 3);
  formHtml += "</table>";
  formHtml += "</form>";

  document.getElementById("form_area").innerHTML = formHtml;
  document.getElementById("savebutton_area").innerHTML = '<input type="button" value="Web Storage更新" onclick="updateEnhancementStorageFromForm();" />';
}

const itemDefinitions = [
  {"item": "icon"   , "line_flg": 0, "mustFlg": "OPTION"},
  {"item": "kana"    , "line_flg": 0, "mustFlg": "MUST"},
  {"item": "Name"    , "line_flg": 0, "mustFlg": "MUST"},
  {"item": "URL"     , "line_flg": 0, "mustFlg": "MUST"},
  {"item": "accounts", "line_flg": 3, "mustFlg": "OPTION"},
  {"item": "category", "line_flg": 1, "mustFlg": "MUST"},
  {"item": "note"    , "line_flg": 2, "mustFlg": "OPTION"},
];

const BLANK_ACCOUNT_ROW_COUNT = 2;

// formタグの情報を格納
wStr = ""

// 更新対象のWeb Storage情報
let currentListKey = "";

// 更新対象のjson変数
let targetList = "";
let targetInfo = "";


function set_form_cell(formFlg, lineFlg, element, itemValue, mustFlag){
  // 1項目の入力フォームを作る
  let fieldHtml = "";
  //fieldHtml+= "<div>";
  fieldHtml+= '<label for="'+element+'">'+element+'</label>';
  if(lineFlg == 0){
    fieldHtml+= '<input type="text" id="'+element+'" name="'+element+'" value="'+ escapeHtml(itemValue) +'" size="100%" >';
  }else if(lineFlg == 1){
    fieldHtml+= '<textarea id="'+element+'" name="'+element+'" cols="50" rows="7">'+ escapeHtml(itemValue) +'</textarea>';
  }else{
    fieldHtml+= '<textarea id="'+element+'" name="'+element+'" cols="100%" rows="5">'+ escapeHtml(itemValue) +'</textarea>';
  }
  //fieldHtml+= '</div>';

  if(mustFlag=="MUST"){
    fieldHtml = "<font color='red'>" +fieldHtml+ "</font>";
  }

  return(fieldHtml);
}

function getLinkAccounts(linkItem){
  const accounts = [];
  if(linkItem && Array.isArray(linkItem["accounts"])){
    for(let accountIndex = 0; accountIndex < linkItem["accounts"].length; accountIndex++){
      const account = linkItem["accounts"][accountIndex];
      if(account && (account["accountId"] != "" || account["password"] != "")){
        accounts.push({
          "accountId": account["accountId"] || "",
          "password": account["password"] || ""
        });
      }
    }
  }
  if(linkItem && (linkItem["accountId"] || linkItem["password"])){
    accounts.push({
      "accountId": linkItem["accountId"] || "",
      "password": linkItem["password"] || ""
    });
  }
  return accounts;
}

function setAccountFormCells(linkItem){
  const accounts = getLinkAccounts(linkItem);
  const rowCount = accounts.length + BLANK_ACCOUNT_ROW_COUNT;
  let fieldHtml = "<fieldset>";
  fieldHtml += "<legend>accounts</legend>";
  for(let accountIndex = 0; accountIndex < rowCount; accountIndex++){
    const account = accounts[accountIndex] || {"accountId": "", "password": ""};
    fieldHtml += '<label for="accountId">accountId</label>';
    fieldHtml += '<input type="text" name="accountId" value="' + escapeHtml(account["accountId"]) + '" size="45" >';
    fieldHtml += '<label for="password">password</label>';
    fieldHtml += '<input type="text" name="password" value="' + escapeHtml(account["password"]) + '" size="45" >';
    fieldHtml += "<BR />";
  }
  fieldHtml += "</fieldset>";
  return fieldHtml;
}

function setLinkInfoFormCells(linkInfo){
  let fieldHtml = "<fieldset>";
  fieldHtml += "<legend>link info</legend>";
  fieldHtml += '<label for="linkInfoTitle">Title</label>';
  fieldHtml += '<input type="text" id="linkInfoTitle" name="linkInfoTitle" value="' + escapeHtml(linkInfo["Title"] || "") + '" size="100%" >';
  fieldHtml += "</fieldset>";
  return fieldHtml;
}

function set_form_flow(itemDefinitions, listItem){
  // 指定データをもとにフォームを作る。指定データがなければ値は空になる
  let formHtml = "";
  let itemValue = "";
  let categoryText = "";
  for (const definitionIndex in itemDefinitions) {
    let formFlg = 1;
    let lineFlg = Number(itemDefinitions[definitionIndex]["line_flg"]);
    let itemName = itemDefinitions[definitionIndex]["item"];
    let mustFlag  = itemDefinitions[definitionIndex]["mustFlg"];

    let itemNo = Number(definitionIndex) + 1;
    if(definitionIndex == 0){
      formFlg = 0;
    }else if(itemNo == itemDefinitions.length){
      formFlg = -1;
    }

    if(itemName == "accounts"){
      formHtml += setAccountFormCells(listItem);
      formHtml += "<BR />";
      continue;
    }

    itemValue = listItem[itemName];

    if (typeof itemValue === "undefined"){
      itemValue = "";
    }else  if (typeof itemValue === "object"){
      categoryText = "";
      for(const cell in itemValue){
        if (itemValue[cell]["key"] != ""){
          categoryText += '"'+itemValue[cell]["key"]+'": "'+itemValue[cell]["kana"] + '"\n';
        }
      }
      categoryText = categoryText.trim();  // 最後の改行コードを削除
      itemValue = categoryText;
    }
    //formHtml += "<div class='div_f2'>";
    //console.log( "DEBUG " + itemName +", "+ mustFlag);
    formHtml += set_form_cell(formFlg, lineFlg, itemName, itemValue, mustFlag);
    formHtml += "<BR />";
    //formHtml += "</div>";
  }
  return(formHtml);
}


function updateLinkStorageFromForm(){
  const linkData = {
    "info": {
      "Title": targetInfo["Title"],
      "ID": normalizeLinkInfoId(targetInfo["ID"]),
      "NOTE": targetInfo["NOTE"]
    },
    "list": []
  };
  let currentItem = {};
  let currentAccounts = [];
  let currentAccount = {};
  let shouldWrite = true;
  let fieldName = "";
  let fieldValue= "";

  const formElements = document.forms.linklist;

  for(let formIndex = 0; formIndex < formElements.length; formIndex++){
    fieldName = formElements.elements.item(formIndex).name;
    fieldValue= formElements.elements.item(formIndex).value;

    switch (fieldName){
      case "linkInfoTitle":
        linkData["info"]["Title"] = fieldValue;
        break;
      case "icon":
        currentItem = {};
        currentAccounts = [];
        currentAccount = {};
        if(fieldValue != ""){
          currentItem[fieldName] = fieldValue;
        }
        break;
      case "kana":
        currentItem[fieldName] = fieldValue;
        break;
      case "Name":
        currentItem[fieldName] = fieldValue;
        if(fieldValue == "") shouldWrite = false;
        break;
      case "URL":
        currentItem[fieldName] = fieldValue;
        break;
      case "accountId":
        if(fieldValue != ""){
          currentAccount["accountId"] = fieldValue;
        }
        break;
      case "password":
        if(fieldValue != ""){
          currentAccount["password"] = fieldValue;
        }
        if(currentAccount["accountId"] || currentAccount["password"]){
          currentAccounts.push(currentAccount);
        }
        currentAccount = {};
        break;
      case "category":
        currentItem[fieldName] = parseCategoryInput(fieldValue);
        break;
      case "note":
        currentItem[fieldName] = fieldValue;
        if(currentAccounts.length > 0){
          currentItem["accounts"] = currentAccounts;
        }
        if(shouldWrite){
          linkData["list"].push(currentItem);
        }
        currentItem = {};
        currentAccounts = [];
        currentAccount = {};
        shouldWrite = true;
        break;
    }
  }

  try {
    setLinkDataToStorage(currentListKey, linkData);
    addLinkInfoIdToVisibility(linkData["info"]["ID"]);
    renderLinkStorageControls();
    refreshParentAreaB(getVisibleLinkIds(), getAreaBVisibleLinkIds());
    document.getElementById("message_area").innerHTML = "更新しました";
  } catch (error) {
    console.error("Failed to update Web Storage:", error);
    document.getElementById("message_area").innerHTML = '<font color="red">エラーが発生し更新できませんでした</font>';
  }
}

function parseCategoryInput(categoryInput){
  const categoryList = [];
  const categoryLines = categoryInput.split("\n");

  for(const lineIndex in categoryLines){
    const categoryParts = categoryLines[lineIndex].split('"');
    const categoryKey = categoryParts[1];
    let categoryKana = categoryParts[3];

    if(typeof categoryKey === "undefined" || categoryKey == ""){
      continue;
    }

    if(typeof categoryKana === "undefined"){
      categoryKana = "";
    }else if(categoryKana != ""){
      const firstKanaChar = categoryKana[0];
      const normalizedFirstKanaChar = firstKanaChar.normalize('NFD')[0];
      categoryKana = categoryKana.replace(firstKanaChar, normalizedFirstKanaChar);
    }

    categoryList.push({"key": categoryKey, "kana": categoryKana});
  }

  return categoryList;
}


function set_init(){
  document.getElementById("form_area").innerHTML = "";
  document.getElementById("message_area").innerHTML = "";
  wStr = "";
  document.getElementById("savebutton_area").innerHTML = "";  // 更新ボタンを消す
}

function makeEmptyLinkData(selectedListKey){
  const infoId = Number(selectedListKey.replace("list", ""));
  return {
    "info": {
      "Title": "links_" + String(infoId).padStart(2, "0"),
      "ID": infoId,
      "NOTE": ""
    },
    "list": []
  };
}


function root_flow(selectedListKey){
  set_init();  // 初期値設定
  currentListKey = selectedListKey;
  wStr += '<form name="linklist" action="" onsubmit="">'

  let targetData = getLinkDataFromStorage(selectedListKey);
  if(targetData == null){
    targetData = makeEmptyLinkData(selectedListKey);
  }

  targetList = targetData["list"];
  targetInfo = targetData["info"];
  wStr += setLinkInfoFormCells(targetInfo);
  wStr += "<HR />";

  for (const listIndex in targetList) {
    // jsonデータを設定値にしてフォームを作る
    wStr += set_form_flow(itemDefinitions,targetList[listIndex]);
    wStr += "<HR />";
  }

  // 新規登録用のフォーム枠を作る数を取得する
  //const LPMAX = Number(document.getElementById("number_of_blank_cells").value);
  const LPMAX = 3;
  
  for(let step = 0; step < LPMAX; step++) {
    // 各値が空白のフォームを作る
    wStr += set_form_flow(itemDefinitions, "NONE");
    wStr += "<HR />";
  }

  wStr += '</form>';
  wStr += '<input type="button" value="Web Storage更新" onclick="updateLinkStorageFromForm();" />';

  document.getElementById("form_area").innerHTML = wStr;
}




// ----------------------------------- //
// ROOT FLOW

renderLinkListButtons();
set_init();  // 初期値設定
renderLinkStorageControls();

</script>
