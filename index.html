//---- ↓↓ 左側に表示するリストの設定 ↓↓ ----//

const storage = localStorage;
const LINK_STORAGE_PREFIX = "HTML-JavaScript-LinkLists.links.";
const LINK_VISIBILITY_STORAGE_KEY = "HTML-JavaScript-LinkLists.visibleLinkIds";
const AREA_B_VISIBILITY_STORAGE_KEY = "HTML-JavaScript-LinkLists.areaBVisibleLinkIds";
const ENHANCEMENT_STORAGE_KEY = "HTML-JavaScript-LinkLists.functionEnhancement";
const OPERATION_LOG_STORAGE_KEY = "HTML-JavaScript-LinkLists.operationLog";
const BACKUP_FORMAT = "HTML-JavaScript-LinkLists.backup";
const BACKUP_FORMAT_VERSION = 1;
const DEFAULT_ORIGINAL_ID = "HTML-JavaScript-LinkLists";
const DEFAULT_OPERATION_LOG_MAX = 100;
const linkListKeys = Array.from({length: 99}, (_, index) => "list" + String(index + 1).padStart(2, "0"));
let load_arr = [];

let list = [];
let listinfo = [];
let visibleLinkIds = [];

let c1key  = new Array();  // categoryの情報
let iptkey = new Array();  // 検索欄の情報
let icons = new Array();  // 画像ファイル名
let area100Str = "";
let reiwa = ""; // 令和の年数


// 読み込むjsonを変数 list に追加
function getLinkStorageKey(listKey){
  return LINK_STORAGE_PREFIX + listKey;
}

function makeListKeyFromInfoId(infoId){
  return "list" + String(infoId).padStart(2, "0");
}

function normalizeLinkInfoId(infoId){
  const numberInfoId = Number(infoId);
  return Number.isFinite(numberInfoId) ? numberInfoId : infoId;
}

function normalizeLinkInfoIds(linkInfoIds){
  return linkInfoIds.map(infoId => normalizeLinkInfoId(infoId));
}

function makeJsonFileName(listData){
  return "links_" + String(listData["info"]["ID"]).padStart(2, "0") + ".json";
}

function isValidLinkData(linkData){
  return linkData
    && typeof linkData === "object"
    && linkData["info"]
    && typeof linkData["info"]["ID"] !== "undefined"
    && Array.isArray(linkData["list"]);
}

function getLinkDataFromStorage(listKey){
  const storedValue = storage.getItem(getLinkStorageKey(listKey));
  if(storedValue == null) return null;
  try {
    const linkData = JSON.parse(storedValue);
    if(!isValidLinkData(linkData)) return null;
    linkData["info"]["ID"] = normalizeLinkInfoId(linkData["info"]["ID"]);
    return linkData;
  } catch (error) {
    console.warn("Invalid link data in Web Storage:", listKey, error);
    return null;
  }
}

function setLinkDataToStorage(listKey, linkData){
  storage.setItem(getLinkStorageKey(listKey), JSON.stringify(linkData));
}

function getObjectFromKeyedArray(keyedArray){
  const object = {};
  for(let key in keyedArray){
    object[key] = keyedArray[key];
  }
  return object;
}

function replaceKeyedArrayValues(keyedArray, sourceObject){
  for(let key in keyedArray){
    delete keyedArray[key];
  }
  for(let key in sourceObject){
    keyedArray[key] = sourceObject[key];
  }
}

function replaceListValues(targetList, sourceList){
  targetList.length = 0;
  for(let index = 0; index < sourceList.length; index++){
    targetList.push(sourceList[index]);
  }
}

function makeEnhancementDataFromGlobals(){
  return {
    "type": "function_enhancement",
    "key_highlight": getObjectFromKeyedArray(key_highlight),
    "key_icon": getObjectFromKeyedArray(key_icon),
    "targetDateList": targetDateList,
    "targetWeekList": targetWeekList,
    "originalId": typeof originalId === "undefined" ? DEFAULT_ORIGINAL_ID : originalId,
    "operationLogMax": typeof operationLogMax === "undefined" ? DEFAULT_OPERATION_LOG_MAX : operationLogMax
  };
}

const defaultEnhancementSnapshot = JSON.stringify(makeEnhancementDataFromGlobals());

function isValidEnhancementData(enhancementData){
  return enhancementData
    && typeof enhancementData === "object"
    && typeof enhancementData["key_highlight"] === "object"
    && typeof enhancementData["key_icon"] === "object"
    && Array.isArray(enhancementData["targetDateList"])
    && Array.isArray(enhancementData["targetWeekList"]);
}

function getEnhancementDataFromStorage(){
  const storedValue = storage.getItem(ENHANCEMENT_STORAGE_KEY);
  if(storedValue == null) return null;
  try {
    const enhancementData = JSON.parse(storedValue);
    return isValidEnhancementData(enhancementData) ? enhancementData : null;
  } catch (error) {
    console.warn("Invalid function enhancement data in Web Storage:", error);
    return null;
  }
}

function setEnhancementDataToStorage(enhancementData){
  enhancementData["originalId"] = getValidatedOriginalId(enhancementData["originalId"]);
  enhancementData["operationLogMax"] = getValidatedOperationLogMax(enhancementData["operationLogMax"]);
  storage.setItem(ENHANCEMENT_STORAGE_KEY, JSON.stringify(enhancementData));
  saveOperationLogs(getOperationLogs());
}

function applyEnhancementData(enhancementData){
  replaceKeyedArrayValues(key_highlight, enhancementData["key_highlight"]);
  replaceKeyedArrayValues(key_icon, enhancementData["key_icon"]);
  replaceListValues(targetDateList, enhancementData["targetDateList"]);
  replaceListValues(targetWeekList, enhancementData["targetWeekList"]);
}

function loadEnhancementDataFromStorage(saveDefaults = true){
  let enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    enhancementData = JSON.parse(defaultEnhancementSnapshot);
    if(saveDefaults){
      setEnhancementDataToStorage(enhancementData);
    }
  }
  applyEnhancementData(enhancementData);
}

function makeEnhancementJsonFileName(){
  return "function_enhancement.json";
}

function getValidatedOriginalId(value){
  const originalIdValue = String(value == null ? "" : value).trim();
  return originalIdValue == "" ? DEFAULT_ORIGINAL_ID : originalIdValue;
}

function getOriginalId(){
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    return DEFAULT_ORIGINAL_ID;
  }

  return getValidatedOriginalId(enhancementData["originalId"]);
}

function getValidatedOperationLogMax(value){
  const operationLogMax = Number(value);
  if(Number.isFinite(operationLogMax) && operationLogMax >= 0){
    return Math.floor(operationLogMax);
  }

  return DEFAULT_OPERATION_LOG_MAX;
}

function getOperationLogMax(){
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    return DEFAULT_OPERATION_LOG_MAX;
  }

  return getValidatedOperationLogMax(enhancementData["operationLogMax"]);
}

function getOperationLogs(){
  const storedValue = storage.getItem(OPERATION_LOG_STORAGE_KEY);
  if(storedValue == null){
    return [];
  }

  try {
    const operationLogs = JSON.parse(storedValue);
    return Array.isArray(operationLogs) ? operationLogs : [];
  } catch (error) {
    console.warn("Invalid operation log data in Web Storage:", error);
    return [];
  }
}

function saveOperationLogs(operationLogs){
  const operationLogMax = getOperationLogMax();
  const trimmedLogs = operationLogMax == 0
    ? []
    : operationLogs.slice(Math.max(operationLogs.length - operationLogMax, 0));
  storage.setItem(OPERATION_LOG_STORAGE_KEY, JSON.stringify(trimmedLogs));
}

function getWeekdayText(date){
  return ["日","月","火","水","木","金","土"][date.getDay()];
}

function getLocaleDateTimeText(date){
  return date.toLocaleString();
}

function getOperationLogUtcDateTime(operationLog){
  return operationLog["utcDateTime"] || "";
}

function getOperationLogLocaleDateTime(operationLog){
  return operationLog["localeDateTime"] || operationLog["datetime"] || "";
}

function getOperationLogWeekday(operationLog){
  if(operationLog["weekday"]){
    return operationLog["weekday"];
  }
  const dateTimeText = operationLog["localeDateTime"] || operationLog["utcDateTime"] || operationLog["datetime"];
  if(dateTimeText){
    return getWeekdayText(new Date(dateTimeText));
  }
  return "";
}

function getOperationLogOriginalId(operationLog){
  if(operationLog["originalId"]){
    return operationLog["originalId"];
  }
  return "";
}

function recordOperationLog(action, detail){
  const logDate = new Date();
  const operationLogs = getOperationLogs();
  operationLogs.push({
    "utcDateTime": logDate.toISOString(),
    "localeDateTime": getLocaleDateTimeText(logDate),
    "weekday": getWeekdayText(logDate),
    "originalId": getOriginalId(),
    "action": action,
    "detail": detail
  });
  saveOperationLogs(operationLogs);
}

function recordCopyOperationLog(){
  recordOperationLog("コピー", "copyOperation");
}

document.addEventListener("copy", recordCopyOperationLog);

function escapeHtml(value){
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

let skipNextCopyEventLog = false;

function recordCopyOperationLog(){
  if(skipNextCopyEventLog){
    skipNextCopyEventLog = false;
    return;
  }
  recordOperationLog("コピー", "copyOperation");
}

function copyTextWithTemporaryInput(textToCopy, shouldRecordCopyLog = true){
  const temporaryInput = document.createElement("textarea");
  temporaryInput.value = textToCopy;
  temporaryInput.setAttribute("readonly", "readonly");
  temporaryInput.style.position = "fixed";
  temporaryInput.style.left = "-9999px";
  document.body.appendChild(temporaryInput);
  temporaryInput.select();
  skipNextCopyEventLog = true;
  document.execCommand("copy");
  document.body.removeChild(temporaryInput);
  skipNextCopyEventLog = false;
  if(shouldRecordCopyLog){
    recordOperationLog("コピー", "copyOperation");
  }
}

function copyTextToClipboard(textToCopy, shouldRecordCopyLog = true){
  if(textToCopy == null || textToCopy == ""){
    return;
  }

  if(navigator.clipboard && typeof navigator.clipboard.writeText === "function"){
    navigator.clipboard.writeText(String(textToCopy))
      .then(() => {
        if(shouldRecordCopyLog){
          recordOperationLog("コピー", "copyOperation");
        }
      })
      .catch(() => copyTextWithTemporaryInput(String(textToCopy), shouldRecordCopyLog));
    return;
  }

  copyTextWithTemporaryInput(String(textToCopy), shouldRecordCopyLog);
}

function hasAccountValue(accountValue){
  return typeof accountValue !== "undefined" && accountValue != "";
}

function getLinkAccounts(linkItem){
  const accounts = [];
  if(linkItem && Array.isArray(linkItem["accounts"])){
    for(let accountIndex = 0; accountIndex < linkItem["accounts"].length; accountIndex++){
      const account = linkItem["accounts"][accountIndex];
      if(account && (hasAccountValue(account["accountId"]) || hasAccountValue(account["password"]))){
        accounts.push({
          "accountId": account["accountId"] || "",
          "password": account["password"] || "",
          "description": typeof account["description"] === "string" ? account["description"].trim() : ""
        });
      }
    }
  }
  if(linkItem && (hasAccountValue(linkItem["accountId"]) || hasAccountValue(linkItem["password"]))){
    accounts.push({
      "accountId": linkItem["accountId"] || "",
      "password": linkItem["password"] || ""
    });
  }
  return accounts;
}

function copyLinkAccountValue(linkIndex, accountIndex, fieldName){
  if(typeof list[linkIndex] === "undefined"){
    return;
  }
  const accounts = getLinkAccounts(list[linkIndex]);
  if(typeof accounts[accountIndex] === "undefined"){
    return;
  }
  if(fieldName != "accountId" && fieldName != "password"){
    return;
  }
  recordOperationLog("コピーボタンクリック", "fieldName=" + fieldName + "____accountIndex=" + accountIndex + "____linkName=" + (list[linkIndex]["Name"] || ""));
  copyTextToClipboard(accounts[accountIndex][fieldName], false);
}

function escapeCsvValue(value){
  return '"' + String(value == null ? "" : value).replace(/"/g, '""') + '"';
}

function exportOperationLogCsv(){
  const operationLogs = getOperationLogs();
  let csvText = "\uFEFF";
  csvText += ["日時(UTC)", "日時(ロケール)", "曜日", "originalId", "操作", "詳細"].map(escapeCsvValue).join(",") + "\r\n";

  for(let logIndex = 0; logIndex < operationLogs.length; logIndex++){
    const operationLog = operationLogs[logIndex];
    csvText += [
      getOperationLogUtcDateTime(operationLog),
      getOperationLogLocaleDateTime(operationLog),
      getOperationLogWeekday(operationLog),
      getOperationLogOriginalId(operationLog),
      operationLog["action"] || "",
      operationLog["detail"] || ""
    ].map(escapeCsvValue).join(",") + "\r\n";
  }

  downloadTextFile(makeOperationLogCsvFileName(operationLogs), csvText, "text/csv");
}

function padNumber(value, length){
  return String(value).padStart(length, "0");
}

function formatLogDateTime(dateTimeText){
  const date = dateTimeText ? new Date(dateTimeText) : new Date();
  const validDate = Number.isNaN(date.getTime()) ? new Date() : date;
  return validDate.getFullYear()
    + "-" + padNumber(validDate.getMonth() + 1, 2)
    + "-" + padNumber(validDate.getDate(), 2)
    + "_" + padNumber(validDate.getHours(), 2)
    + "-" + padNumber(validDate.getMinutes(), 2)
    + "-" + padNumber(validDate.getSeconds(), 2);
}

function sanitizeFileNamePart(value){
  return String(value).replace(/[\\/:*?"<>|]/g, "_");
}

function makeOperationLogCsvFileName(operationLogs){
  const firstLog = operationLogs.length > 0 ? operationLogs[0] : null;
  const lastLog = operationLogs.length > 0 ? operationLogs[operationLogs.length - 1] : null;
  return sanitizeFileNamePart(getOriginalId())
    + "__" + formatLogDateTime(firstLog == null ? "" : getOperationLogLocaleDateTime(firstLog))
    + "__" + formatLogDateTime(lastLog == null ? "" : getOperationLogLocaleDateTime(lastLog))
    + "__" + padNumber(operationLogs.length, 7)
    + ".csv";
}

function getAllLinkInfoIds(){
  const linkInfoIds = [];
  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const linkData = getLinkDataFromStorage(linkListKeys[keyIndex]);
    if(linkData != null){
      linkInfoIds.push(normalizeLinkInfoId(linkData["info"]["ID"]));
    }
  }
  return linkInfoIds;
}

function loadVisibleLinkIds(){
  const allLinkInfoIds = getAllLinkInfoIds();
  const storedValue = storage.getItem(LINK_VISIBILITY_STORAGE_KEY);
  if(storedValue == null){
    visibleLinkIds = allLinkInfoIds;
    return;
  }

  try {
    const storedIds = JSON.parse(storedValue);
    visibleLinkIds = Array.isArray(storedIds)
      ? normalizeLinkInfoIds(storedIds).filter(infoId => allLinkInfoIds.includes(infoId))
      : allLinkInfoIds;
  } catch (error) {
    console.warn("Invalid visible link ids in Web Storage:", error);
    visibleLinkIds = allLinkInfoIds;
  }
}

function saveVisibleLinkIds(linkInfoIds){
  visibleLinkIds = normalizeLinkInfoIds(linkInfoIds);
  storage.setItem(LINK_VISIBILITY_STORAGE_KEY, JSON.stringify(visibleLinkIds));
}

function saveAreaBVisibleLinkIds(linkInfoIds){
  const normalizedLinkInfoIds = normalizeLinkInfoIds(linkInfoIds);
  storage.setItem(AREA_B_VISIBILITY_STORAGE_KEY, JSON.stringify(normalizedLinkInfoIds.filter(infoId => visibleLinkIds.includes(infoId))));
}

function addLinkInfoIdToVisibility(linkInfoId){
  const normalizedLinkInfoId = normalizeLinkInfoId(linkInfoId);
  loadVisibleLinkIds();
  saveVisibleLinkIds(Array.from(new Set(visibleLinkIds.concat([normalizedLinkInfoId]))));
  b1key.length = 0;
  loadAreaBVisibleLinkIds();
  saveAreaBVisibleLinkIds(Array.from(new Set(b1key.concat([normalizedLinkInfoId]))));
}

function isLinkInfoVisible(linkInfoId){
  return visibleLinkIds.includes(normalizeLinkInfoId(linkInfoId));
}

function loadAreaBVisibleLinkIds(){
  const storedValue = storage.getItem(AREA_B_VISIBILITY_STORAGE_KEY);
  if(storedValue == null){
    b1key = b1key.concat(visibleLinkIds);
    isAreaBFilterActive = true;
    return;
  }

  try {
    const storedIds = JSON.parse(storedValue);
    b1key = Array.isArray(storedIds)
      ? b1key.concat(normalizeLinkInfoIds(storedIds).filter(infoId => visibleLinkIds.includes(infoId)))
      : b1key.concat(visibleLinkIds);
  } catch (error) {
    console.warn("Invalid AreaB visible link ids in Web Storage:", error);
    b1key = b1key.concat(visibleLinkIds);
  }
  isAreaBFilterActive = true;
}

function refreshLoadArrFromStorage(){
  load_arr.length = 0;
  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const linkData = getLinkDataFromStorage(linkListKeys[keyIndex]);
    if(linkData != null){
      load_arr.push(linkData);
    }
  }
}

  set_List();

function refreshAreaBFromStorage(){

function refreshAreaBWithVisibility(nextVisibleLinkIds, nextAreaBVisibleLinkIds){
  const allLinkInfoIds = getAllLinkInfoIds();
  set_Initial();
  loadEnhancementDataFromStorage();
  refreshLoadArrFromStorage();
  visibleLinkIds = normalizeLinkInfoIds(nextVisibleLinkIds).filter(infoId => allLinkInfoIds.includes(infoId));
  b1key = normalizeLinkInfoIds(nextAreaBVisibleLinkIds).filter(infoId => visibleLinkIds.includes(infoId));
  isAreaBFilterActive = true;

function handleLinkStorageMessage(event){
  if(!event.data || event.data["type"] != "HTML-JavaScript-LinkLists.refreshAreaB"){
    return;
  }
  if(Array.isArray(event.data["visibleLinkIds"]) && Array.isArray(event.data["areaBVisibleLinkIds"])){
    refreshAreaBWithVisibility(event.data["visibleLinkIds"], event.data["areaBVisibleLinkIds"]);
    return;
  }
  refreshAreaBFromStorage();
}

window.addEventListener("message", handleLinkStorageMessage);

function getLinkItemDuplicateKey(linkItem){
  return String(linkItem["Name"] || "") + "\u0001" + String(linkItem["URL"] || "");
}

function appendImportedNote(registeredNote, importedNote){
  if(importedNote == null || importedNote == ""){
    return registeredNote || "";
  }
  if(registeredNote == null || registeredNote == ""){
    return importedNote;
  }
  return registeredNote + "\n" + importedNote;
}

function mergeLinkData(registeredLinkData, importedLinkData, duplicateStrategy){
  const mergedLinkData = {
    "info": registeredLinkData["info"],
    "list": []
  };
  const importedItemByDuplicateKey = {};

  for(let importedIndex = 0; importedIndex < importedLinkData["list"].length; importedIndex++){
    const importedItem = importedLinkData["list"][importedIndex];
    importedItemByDuplicateKey[getLinkItemDuplicateKey(importedItem)] = importedItem;
  }

  for(let registeredIndex = 0; registeredIndex < registeredLinkData["list"].length; registeredIndex++){
    const registeredItem = registeredLinkData["list"][registeredIndex];
    const duplicateKey = getLinkItemDuplicateKey(registeredItem);
    const importedItem = importedItemByDuplicateKey[duplicateKey];

    if(typeof importedItem === "undefined"){
      mergedLinkData["list"].push(registeredItem);
      continue;
    }

    if(duplicateStrategy == "overwrite"){
      mergedLinkData["list"].push(importedItem);
    }else if(duplicateStrategy == "appendNote"){
      const mergedItem = Object.assign({}, registeredItem);
      mergedItem["note"] = appendImportedNote(registeredItem["note"], importedItem["note"]);
      mergedLinkData["list"].push(mergedItem);
    }else{
      mergedLinkData["list"].push(registeredItem);
    }

    delete importedItemByDuplicateKey[duplicateKey];
  }

  for(let importedIndex = 0; importedIndex < importedLinkData["list"].length; importedIndex++){
    const importedItem = importedLinkData["list"][importedIndex];
    const duplicateKey = getLinkItemDuplicateKey(importedItem);
    if(typeof importedItemByDuplicateKey[duplicateKey] !== "undefined"){
      mergedLinkData["list"].push(importedItem);
      delete importedItemByDuplicateKey[duplicateKey];
    }
  }

  return mergedLinkData;
}

function getLinkImportConflictResolution(importedFile, registeredLinkData, suggestedInfoId, isValidImportedInfoId){
  return new Promise(resolve => {
    const importedLinkData = importedFile["jsonData"];
    const importedInfo = importedLinkData["info"];
    const importedInfoId = normalizeLinkInfoId(importedInfo["ID"]);
    const dialogOverlay = makeImportDialogOverlay();
    const dialogPanel = makeImportDialogPanel();
    const registeredInfo = registeredLinkData == null ? null : registeredLinkData["info"];
    const newModeDisabledAttr = suggestedInfoId == null ? " disabled='disabled'" : "";
    const newModeCheckedAttr = suggestedInfoId == null ? "" : " checked='checked'";
    const skipModeCheckedAttr = suggestedInfoId == null ? " checked='checked'" : "";

    let conflictMessage = "JSONの内部IDが利用できないため、新しい空きIDを割り当てます。";
    if(isValidImportedInfoId){
      conflictMessage = "同じ内部IDのリンク情報が、すでに登録または取込予定になっています。";
    }

    let registeredInfoHtml = "";
    if(registeredInfo != null){
      registeredInfoHtml = "<p><b>登録済み・取込予定:</b> "
        + escapeImportHtml(registeredInfo["Title"] || "Title未設定") + "<br><small>"
        + escapeImportHtml(registeredInfo["NOTE"] || "") + "</small></p>";
    }

    const technicalInfoHtml = "<details><summary>技術情報</summary><small>JSON内部ID: "
      + escapeImportHtml(importedInfoId)
      + (suggestedInfoId == null ? "" : " / 新規取込時の割当予定ID: " + escapeImportHtml(suggestedInfoId))
      + "</small></details>";

    dialogPanel.innerHTML = ""
      + "<h3>リンクJSONの取込方法</h3>"
      + "<p><b>" + escapeImportHtml(importedFile["fileName"]) + "</b><br>" + escapeImportHtml(conflictMessage) + "</p>"
      + registeredInfoHtml
      + "<p><b>取込対象:</b> " + escapeImportHtml(importedInfo["Title"] || "Title未設定") + "<br><small>"
      + escapeImportHtml(importedInfo["NOTE"] || "") + "</small></p>"
      + technicalInfoHtml
      + "<fieldset><legend>取込方法</legend>"
      + "<label><input type='radio' name='linkImportConflictMode' value='new'" + newModeCheckedAttr + newModeDisabledAttr + "> 新規情報として取り込む"
      + (suggestedInfoId == null ? "（空きIDなし）" : "（空きIDを自動割り当て）") + "</label><br>"
      + (isValidImportedInfoId ? "<label><input type='radio' name='linkImportConflictMode' value='overwrite'> 登録済み情報を上書きする</label><br>" : "")
      + (isValidImportedInfoId ? "<label><input type='radio' name='linkImportConflictMode' value='merge'> 登録済み情報とマージする</label><br>" : "")

      + "</fieldset>"
      + "<div id='linkImportDuplicateStrategyArea' style='display:none; margin-top:12px;'>"
      + "<label>重複リンクの扱い <select id='linkImportDuplicateStrategySelect'>"
      + "<option value='keepRegistered'>登録されているデータのみ残す</option>"
      + "<option value='overwrite'>インポートするデータで上書きする</option>"
      + "<option value='appendNote'>登録されているデータの note に、インポートするデータの note を追記する</option>"
      + "</select></label></div>"
      + "<div style='margin-top:16px; text-align:right;'>"
      + "<input type='button' id='linkImportCancelButton' value='取込を中止' /> "
      + "<input type='button' id='linkImportOkButton' value='この方法で続ける' />"
      + "</div>";

    dialogOverlay.appendChild(dialogPanel);
    document.body.appendChild(dialogOverlay);

    const modeInputs = dialogPanel.querySelectorAll("input[name='linkImportConflictMode']");
    const duplicateStrategyArea = dialogPanel.querySelector("#linkImportDuplicateStrategyArea");
    const duplicateStrategySelect = dialogPanel.querySelector("#linkImportDuplicateStrategySelect");
    const closeDialog = (selectedOptions) => {
      document.body.removeChild(dialogOverlay);
      resolve(selectedOptions);
    };
    const updateDuplicateStrategyVisibility = () => {
      const selectedMode = dialogPanel.querySelector("input[name='linkImportConflictMode']:checked");
      duplicateStrategyArea.style.display = selectedMode != null && selectedMode.value == "merge" ? "block" : "none";
    };

    for(let modeIndex = 0; modeIndex < modeInputs.length; modeIndex++){
      modeInputs[modeIndex].onchange = updateDuplicateStrategyVisibility;
    }
    dialogPanel.querySelector("#linkImportCancelButton").onclick = () => closeDialog(null);
    dialogPanel.querySelector("#linkImportOkButton").onclick = () => {
      const selectedMode = dialogPanel.querySelector("input[name='linkImportConflictMode']:checked");
      if(selectedMode == null){
        return;
      }
      if(selectedMode.value == "overwrite"){
        const overwriteTargetTitle = registeredInfo == null ? "登録済み情報" : "「" + (registeredInfo["Title"] || "Title未設定") + "」";
        const overwriteConfirmed = confirm(
          overwriteTargetTitle + "を完全に上書きします。\nこの操作を続けますか？"
        );
        if(!overwriteConfirmed){
          return;
        }
      }
      closeDialog({
        "mode": selectedMode.value,
        "duplicateStrategy": duplicateStrategySelect.value
      });
    };
  });
}

function getImportPlanActionText(planItem){
  if(planItem["mode"] == "skip") return "取込しない";
  if(planItem["kind"] == "enhancement") return "設定を更新";
  const title = planItem["data"] && planItem["data"]["info"]
    ? planItem["data"]["info"]["Title"] || "Title未設定"
    : "Title未設定";
  if(planItem["mode"] == "overwrite") return "登録済み情報を「" + title + "」で上書き";
  if(planItem["mode"] == "merge") return "「" + title + "」にマージ";
  return "「" + title + "」を新規登録";
}

function getImportPlanLogDetail(planItem){
  let logDetail = planItem["fileName"] + "____" + getImportPlanActionText(planItem);
  if(planItem["kind"] == "link" && planItem["mode"] != "skip"){
    logDetail += "____targetInfoId=" + planItem["targetInfoId"];
  }
  return logDetail;
}

async function buildJsonImportPlan(importedJsonFiles){
  const stagedLinkDataByInfoId = new Map();
  const reservedInfoIds = new Set();
  const importPlan = [];

  for(let infoId = 1; infoId <= 99; infoId++){
    const registeredLinkData = getLinkDataFromStorage(makeListKeyFromInfoId(infoId));
    if(registeredLinkData != null){
      stagedLinkDataByInfoId.set(infoId, registeredLinkData);
      reservedInfoIds.add(infoId);
    }
  }

  for(let importedFileIndex = 0; importedFileIndex < importedJsonFiles.length; importedFileIndex++){
    const importedFile = importedJsonFiles[importedFileIndex];
    const jsonData = importedFile["jsonData"];
    if(isValidEnhancementData(jsonData)){
      importPlan.push({"fileName": importedFile["fileName"], "kind": "enhancement", "mode": "overwrite", "data": jsonData});
      continue;
    }

    const importedLinkData = JSON.parse(JSON.stringify(jsonData));
    const sourceInfoId = normalizeLinkInfoId(importedLinkData["info"]["ID"]);
    const isValidSourceInfoId = isAssignableLinkInfoId(sourceInfoId);
    const registeredLinkData = isValidSourceInfoId ? stagedLinkDataByInfoId.get(sourceInfoId) : null;

    if(isValidSourceInfoId && registeredLinkData == null){
      importedLinkData["info"]["ID"] = sourceInfoId;
      stagedLinkDataByInfoId.set(sourceInfoId, importedLinkData);
      reservedInfoIds.add(sourceInfoId);
      importPlan.push({
        "fileName": importedFile["fileName"], "kind": "link", "mode": "new",
        "sourceInfoId": sourceInfoId, "targetInfoId": sourceInfoId, "data": importedLinkData
      });
      continue;
    }

    const suggestedInfoId = getFirstAvailableImportInfoId(reservedInfoIds);
    const resolution = await getLinkImportConflictResolution(importedFile, registeredLinkData, suggestedInfoId, isValidSourceInfoId);
    if(resolution == null){
      return null;
    }
    if(resolution["mode"] == "skip"){
      importPlan.push({
        "fileName": importedFile["fileName"], "kind": "link", "mode": "skip",
        "sourceInfoId": sourceInfoId, "targetInfoId": null
      });
      continue;
    }
    if(resolution["mode"] == "new"){
      if(suggestedInfoId == null){
        throw new Error(importedFile["fileName"] + ": 空き番号がありません。");
      }
      importedLinkData["info"]["ID"] = suggestedInfoId;
      stagedLinkDataByInfoId.set(suggestedInfoId, importedLinkData);
      reservedInfoIds.add(suggestedInfoId);
      importPlan.push({
        "fileName": importedFile["fileName"], "kind": "link", "mode": "new",
        "sourceInfoId": sourceInfoId, "targetInfoId": suggestedInfoId, "data": importedLinkData
      });
      continue;
    }
    if(resolution["mode"] == "merge"){
      const mergedLinkData = mergeLinkData(registeredLinkData, importedLinkData, resolution["duplicateStrategy"]);
      stagedLinkDataByInfoId.set(sourceInfoId, mergedLinkData);
      importPlan.push({
        "fileName": importedFile["fileName"], "kind": "link", "mode": "merge",
        "sourceInfoId": sourceInfoId, "targetInfoId": sourceInfoId, "data": mergedLinkData
      });
      continue;
    }

    importedLinkData["info"]["ID"] = sourceInfoId;
    stagedLinkDataByInfoId.set(sourceInfoId, importedLinkData);
    importPlan.push({
      "fileName": importedFile["fileName"], "kind": "link", "mode": "overwrite",
      "sourceInfoId": sourceInfoId, "targetInfoId": sourceInfoId, "data": importedLinkData
    });
  }

  return importPlan;
}

function confirmJsonImportPlan(importPlan){
  return new Promise(resolve => {
    const dialogOverlay = makeImportDialogOverlay();
    const dialogPanel = makeImportDialogPanel();
    let planRowsHtml = "";
    let importCount = 0;
    for(let planIndex = 0; planIndex < importPlan.length; planIndex++){
      const planItem = importPlan[planIndex];
      if(planItem["mode"] != "skip") importCount++;
      planRowsHtml += "<tr><td>" + escapeImportHtml(planItem["fileName"]) + "</td><td>"
        + escapeImportHtml(getImportPlanActionText(planItem)) + "</td></tr>";
    }

    dialogPanel.innerHTML = ""
      + "<h3>JSON取込予定の確認</h3>"
      + "<p>まだWeb Storageは更新されていません。次の内容で取り込みます。</p>"
      + "<table style='width:100%; border-collapse:collapse;'>"
      + "<thead><tr><th style='text-align:left; border-bottom:1px solid #888;'>ファイル</th><th style='text-align:left; border-bottom:1px solid #888;'>処理</th></tr></thead>"
      + "<tbody>" + planRowsHtml + "</tbody></table>"
      + "<div style='margin-top:16px; text-align:right;'>"
      + "<input type='button' id='jsonImportPlanCancelButton' value='キャンセル' /> "
      + "<input type='button' id='jsonImportPlanOkButton' value='取込実行'" + (importCount == 0 ? " disabled='disabled'" : "") + " />"
      + "</div>";

    dialogOverlay.appendChild(dialogPanel);
    document.body.appendChild(dialogOverlay);
    const closeDialog = result => {
      document.body.removeChild(dialogOverlay);
      resolve(result);
    };
    dialogPanel.querySelector("#jsonImportPlanCancelButton").onclick = () => closeDialog(false);
    dialogPanel.querySelector("#jsonImportPlanOkButton").onclick = () => closeDialog(true);
  });
}

function restoreStorageValue(storageKey, storedValue){
  if(storedValue == null){
    storage.removeItem(storageKey);
  }else{
    storage.setItem(storageKey, storedValue);
  }
}

function applyJsonImportPlan(importPlan){
  loadVisibleLinkIds();
  const previousVisibleLinkIds = visibleLinkIds.slice();
  b1key.length = 0;
  loadAreaBVisibleLinkIds();
  const previousAreaBVisibleLinkIds = b1key.slice();
  const previousEnhancementData = JSON.parse(JSON.stringify(makeEnhancementDataFromGlobals()));
  const storageBackup = new Map();
  storageBackup.set(LINK_VISIBILITY_STORAGE_KEY, storage.getItem(LINK_VISIBILITY_STORAGE_KEY));
  storageBackup.set(AREA_B_VISIBILITY_STORAGE_KEY, storage.getItem(AREA_B_VISIBILITY_STORAGE_KEY));
  storageBackup.set(ENHANCEMENT_STORAGE_KEY, storage.getItem(ENHANCEMENT_STORAGE_KEY));
  storageBackup.set(OPERATION_LOG_STORAGE_KEY, storage.getItem(OPERATION_LOG_STORAGE_KEY));

  for(let planIndex = 0; planIndex < importPlan.length; planIndex++){
    const planItem = importPlan[planIndex];
    if(planItem["kind"] == "link" && planItem["mode"] != "skip"){
      const storageKey = getLinkStorageKey(makeListKeyFromInfoId(planItem["targetInfoId"]));
      if(!storageBackup.has(storageKey)){
        storageBackup.set(storageKey, storage.getItem(storageKey));
      }
    }
  }

  try {
    const newInfoIds = [];
    let importedCount = 0;
    for(let planIndex = 0; planIndex < importPlan.length; planIndex++){
      const planItem = importPlan[planIndex];
      if(planItem["mode"] == "skip"){
        continue;
      }
      if(planItem["kind"] == "enhancement"){
        setEnhancementDataToStorage(planItem["data"]);
        applyEnhancementData(planItem["data"]);
      }else{
        setLinkDataToStorage(makeListKeyFromInfoId(planItem["targetInfoId"]), planItem["data"]);
        if(planItem["mode"] == "new"){
          newInfoIds.push(planItem["targetInfoId"]);
        }
      }
      importedCount++;
      recordOperationLog("JSON取込", getImportPlanLogDetail(planItem));
    }

    saveVisibleLinkIds(Array.from(new Set(previousVisibleLinkIds.concat(newInfoIds))));
    const isFirstLinkImport = previousVisibleLinkIds.length == 0 && newInfoIds.length > 0;
    saveAreaBVisibleLinkIds(isFirstLinkImport ? newInfoIds : previousAreaBVisibleLinkIds);
    return importedCount;
  } catch (error) {
    storageBackup.forEach((storedValue, storageKey) => restoreStorageValue(storageKey, storedValue));
    visibleLinkIds = previousVisibleLinkIds.slice();
    b1key.length = 0;
    b1key = b1key.concat(previousAreaBVisibleLinkIds);
    applyEnhancementData(previousEnhancementData);
    throw error;
  }
}

function importLinkJsonFiles(files){
  const fileList = Array.from(files);
  const readers = fileList.map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const jsonData = JSON.parse(reader.result);
        resolve({"fileName": file.name, "jsonData": jsonData});
      } catch (error) {
        reject(new Error(file.name + ": " + error.message));
      }
    };
    reader.onerror = () => reject(new Error(file.name + ": file read error"));
    reader.readAsText(file);
  }));

  Promise.all(readers)
    .then(async importedJsonFiles => {
      for(let importedFileIndex = 0; importedFileIndex < importedJsonFiles.length; importedFileIndex++){
        const importedFile = importedJsonFiles[importedFileIndex];
        if(!isValidLinkData(importedFile["jsonData"]) && !isValidEnhancementData(importedFile["jsonData"])){
          throw new Error(importedFile["fileName"] + ": invalid json");
        }
      }

      const importPlan = await buildJsonImportPlan(importedJsonFiles);
      if(importPlan == null){
        return;
      }
      const shouldImport = await confirmJsonImportPlan(importPlan);
      if(!shouldImport){
        return;
      }
      const importedCount = applyJsonImportPlan(importPlan);
      refreshAllAreas();
      alert(importedCount + " file(s) imported.");
    })
    .catch(error => {
      alert("Import failed. " + error.message);
    });
}

function downloadTextFile(fileName, fileContent, contentType){
  const blob = new Blob([fileContent], {type: contentType});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  link.click();
  URL.revokeObjectURL(link.href);
}

function getBackupStorageKeys(){
  return [
    ...linkListKeys.map(getLinkStorageKey),
    LINK_VISIBILITY_STORAGE_KEY,
    AREA_B_VISIBILITY_STORAGE_KEY,
    ENHANCEMENT_STORAGE_KEY,
    OPERATION_LOG_STORAGE_KEY
  ];
}

function collectBackupEntries(){
  const entries = {};
  for(const key of getBackupStorageKeys()){
    const value = storage.getItem(key);
    if(value !== null){
      entries[key] = value;
    }
  }
  return entries;
}

function exportStorageBackup(includeAccountInfo = false){
  const exportedAt = new Date().toISOString();
  const entries = collectBackupEntries();
  if(!includeAccountInfo){
    for(const key of Object.keys(entries)){
      if(key.startsWith(LINK_STORAGE_PREFIX)){
        entries[key] = serializeLinkExport(JSON.parse(entries[key]), false);
      }
    }
  }
  const backup = {format: BACKUP_FORMAT, version: BACKUP_FORMAT_VERSION, exportedAt, entries};
  const timestamp = exportedAt.slice(0, 19).replace(/:/g, "-");
  downloadTextFile("LinkLists-backup-" + timestamp + "Z.json", JSON.stringify(backup, null, 2), "application/json");
}

function parseStorageBackup(fileContent){
  const backup = JSON.parse(fileContent.replace(/^\uFEFF/, ""));
  if(!backup || backup.format !== BACKUP_FORMAT || backup.version !== BACKUP_FORMAT_VERSION){
    throw new Error("対応している完全バックアップファイルを選択してください。");
  }
  if(!backup.entries || typeof backup.entries !== "object" || Array.isArray(backup.entries)){
    throw new Error("バックアップの保存データが見つかりません。");
  }

  const allowedKeys = new Set(getBackupStorageKeys());
  for(const [key, rawValue] of Object.entries(backup.entries)){
    if(!allowedKeys.has(key) || typeof rawValue !== "string"){
      throw new Error("バックアップに未対応の保存項目があります。");
    }
    const value = JSON.parse(rawValue);
    if(key.startsWith(LINK_STORAGE_PREFIX)){
      if(!isValidLinkData(value) || makeListKeyFromInfoId(normalizeLinkInfoId(value.info.ID)) !== key.slice(LINK_STORAGE_PREFIX.length)){
        throw new Error("登録リンクの形式が正しくありません。");
      }
    }else if(key === ENHANCEMENT_STORAGE_KEY){
      if(!isValidEnhancementData(value)){
        throw new Error("拡張設定の形式が正しくありません。");
      }
    }else if(!Array.isArray(value)){
      throw new Error("表示設定または操作ログの形式が正しくありません。");
    }
  }
  return backup.entries;
}

function restoreBackupEntries(entries){
  const previousEntries = collectBackupEntries();
  const changedKeys = getBackupStorageKeys().filter(key => previousEntries[key] !== entries[key]);
  try {
    // 先に差し替え対象の容量を空けてから、バックアップを書き込む。
    for(const key of changedKeys){
      storage.removeItem(key);
    }
    for(const key of changedKeys){
      if(Object.hasOwn(entries, key)){
        storage.setItem(key, entries[key]);
      }
    }
    refreshAllAreas(false);
  } catch (error) {
    try {
      for(const key of changedKeys){
        storage.removeItem(key);
      }
      for(const key of changedKeys){
        if(Object.hasOwn(previousEntries, key)){
          storage.setItem(key, previousEntries[key]);
        }
      }
    } catch (rollbackError) {
      console.error("Backup rollback failed:", rollbackError);
      throw new Error("復元前の状態に戻せませんでした。事前に出力したバックアップを使用してください。");
    }
    refreshAllAreas(false);
    throw error;
  }
}

async function importStorageBackup(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  fileInput.value = "";
  fileInput.disabled = true;
  try {
    const entries = parseStorageBackup(await file.text());
    const linkCount = Object.keys(entries).filter(key => key.startsWith(LINK_STORAGE_PREFIX)).length;
    if(!confirm("登録リンク " + linkCount + "件と設定・操作ログを復元します。\nこのブラウザの登録内容はバックアップの内容に置き換わります。復元しますか？")){
      return;
    }
    document.getElementById("inputKey").value = "";
    document.getElementById("includeAreaBUnselected").checked = false;
    restoreBackupEntries(entries);
    document.getElementById("storageBackupDialog").close();
    alert("バックアップを復元しました。");
  } catch (error) {
    console.error("Backup restore failed:", error);
    alert("バックアップを復元できませんでした。\n" + error.message);
  } finally {
    fileInput.disabled = false;
  }
}

function exportAllLinkJsonFiles(includeAccountInfo = false){
  refreshLoadArrFromStorage();
  const enhancementData = getEnhancementDataFromStorage();
  if(load_arr.length == 0 && enhancementData == null){
    alert("No data in Web Storage.");
    return;
  }
  for(let linkIndex = 0; linkIndex < load_arr.length; linkIndex++){
    const linkData = load_arr[linkIndex];
    const fileName = makeJsonFileName(linkData);
    downloadTextFile(fileName, serializeLinkExport(linkData, includeAccountInfo, 2), "application/json");
    recordOperationLog("JSON出力", fileName);
  }
  if(enhancementData != null){
    const fileName = makeEnhancementJsonFileName();
    downloadTextFile(fileName, JSON.stringify(enhancementData, null, 2), "application/json");
    recordOperationLog("JSON出力", fileName);
  }
}

function set_List(){
  list.length = 0;
  listinfo.length = 0;
  const includeAreaBUnselected = shouldIncludeAreaBUnselectedInSearch();
  for(let lp=0; lp < load_arr.length; lp++){
    const linkInfoId = normalizeLinkInfoId(load_arr[lp]["info"]["ID"]);
    const matchesAreaBSelection = !isAreaBFilterActive || b1key.includes(linkInfoId);
    if (visibleLinkIds.includes(linkInfoId) && (includeAreaBUnselected || matchesAreaBSelection)) {
      list = list.concat(load_arr[lp]["list"]);
      listinfo = listinfo.concat(load_arr[lp]["info"]);
    }
  }
}

function shouldIncludeAreaBUnselectedInSearch(){
  const scopeCheckbox = document.getElementById("includeAreaBUnselected");
  const searchInput = document.getElementById("inputKey");
  return scopeCheckbox != null
    && scopeCheckbox.checked
    && searchInput != null
    && searchInput.value.trim() != "";
}

<script>
function set_Initial(){
  list.length = listinfo.length = b1key.length = c1key.length = iptkey.length = 0;
  isAreaBFilterActive = false;
}

function hiraToKana(str) {
    return str.replace(/[\u3041-\u3096]/g, function(match) {
        var chr = match.charCodeAt(0) + 0x60;
        return String.fromCharCode(chr);
    });
}

function getNormalizedKanaInitial(str) {
    if(str == null || str == "") return "";
    return hiraToKana(str[0].toUpperCase()).normalize('NFD')[0];
}

function hasIconValue(iconValue) {
    return typeof iconValue !== 'undefined' && iconValue != "";
}

function pageReload(){ // ページ再読み込み
  recordOperationLog("リセット", "リセットボタン____displayedLinkCount=" + getDisplayedLinkCount());
  window.location.reload();
}

function showAreaB()

function showAreaC(showFlg){

    let cateStr = "";

        words.push( list[lpa]["category"][lpf]["key"] );
        let tmpKana = "";

        // ------------------- アイコン -------------------

        // ------------------- アイコン -------------------

      // 重複削除

  // キーと値にそれぞれキーをつけた連想配列を格納した配列の作成

    if(exA > exB ) return 1;
    return 0;
  });

    wStr += "</div>";
    wStr += "</label>";
    iconMapKey = "";
  }
  wStr += "</form>";
  document.getElementById("areaC").innerHTML = wStr;
}

function setSelectFlg(tgtIcon, tgtName, tgtUrl, tgtCategory, tgtNote, tgtDecoUrl){
  let rtn = ctn = 0;
  let tgtStr = tgtIcon + "," + tgtName + "," + tgtCategory + "," + tgtNote + "," + tgtDecoUrl;
  let rFlg = new Array();

  tgtStr = tgtStr.toLowerCase(); // 小文字変換

  // rFlg 初期化
  rFlg.length = 0;
  for (let i = 0; i < c1key.length; i++) {
    rFlg[i] = 0;
  }

  for (let i = 0; i < c1key.length; i++) {
    rtn = 0;
    tmpKey = c1key[i].toLowerCase(); // 小文字変換
    if( tgtStr.indexOf( tmpKey ) != -1 ){
      rtn += 1;
    }
    rFlg[i] = rtn;
  } // ------ for (let i = 0; i < c1key.length; i++)
  // AND検索
  ctn = 1;
  for (let i = 0; i < rFlg.length; i++) {
    ctn *= rFlg[i];
  }
  return(ctn);
}

function setAvailableIcons(iconNames){
  // 登録情報の更新に表示するアイコンをカタログから設定
  if(typeof iconCatalog !== "undefined" && Array.isArray(iconCatalog["icons"])){
    for(let iconIndex = 0; iconIndex < iconCatalog["icons"].length; iconIndex++){
      iconNames.push(iconCatalog["icons"][iconIndex]);
    }
  }
  return iconNames;
}

// カテゴリ一覧に表示するカテゴリにチェックボックスを "選択" にするか判定
function setSelectFlg2(tgtStr){
  let rtn = 0;
  tgtStr = tgtStr.toLowerCase(); // 小文字変換
  for (let i = 0; i < c1key.length; i++) {
    tmpKey = c1key[i].toLowerCase(); // 小文字変換
    if( tgtStr == tmpKey ){
      rtn = 1;
      break;
    }
  } // ------ for (let i = 0; i < c1key.length; i++)
  return(rtn);
}

function getDisplayedLinkCount(){
  let displayedLinkCount = 0;
  for(let linkIndex = 0; linkIndex < list.length; linkIndex++){
    let categoryText = "";
    for(let categoryIndex = 0; categoryIndex < list[linkIndex]["category"].length; categoryIndex++){
      if(categoryIndex != 0) categoryText += ", ";
      categoryText += list[linkIndex]["category"][categoryIndex]["key"];
    }

    let decodedUrl;
    if(typeof list[linkIndex]["URL"] !== 'undefined'){
      decodedUrl = decodeURI(list[linkIndex]["URL"]);
    }

    if(setSelectFlg(list[linkIndex]["icon"], list[linkIndex]["Name"], list[linkIndex]["URL"], categoryText, list[linkIndex]["note"], decodedUrl) == 1){
      displayedLinkCount += 1;
    }
  }

  return displayedLinkCount;
}

function set_C1key_B1key(){
  const toElementArray = (elements) => elements == null ? [] : (typeof elements.length === "number" ? Array.from(elements) : [elements]);
  const areaB1 = [];
  const areaB  = toElementArray(document.areaB.areaB1);
  const areaC1 = [];
  const areaC  = toElementArray(document.areaC.areaC1);

  isAreaBFilterActive = areaB.length > 0;
  for (let i = 0; i < areaB.length; i++) {
    if (areaB[i].checked) {
      areaB1.push(normalizeLinkInfoId(areaB[i].value));
    }
  }
  b1key = b1key.concat(areaB1);

  // 検索欄の文字列をc1keyに格納する
  keyStr = document.getElementById("inputKey").value;

  if(keyStr.length > 0)
  {
    keyStr = keyStr.replace(/　/g, ' ');  // 全角空白→半角空白
    keyStr = keyStr.replace(/,/g, ' ');   // , (コロン)→半角空白
    keyStr = keyStr.replace(/\\/g, ' ');  // ￥ →半角空白
    keyStr = keyStr.toLowerCase();        // 小文字変換
    iptkey = keyStr.split(" ");           // 検索欄の文字列を半角空白で分割し配列に格納    
    c1key.length = 0;
    for (let i = 0; i < iptkey.length; i++) {
      c1key.push(iptkey[i]);
    }
  }

  for (let i = 0; i < areaC.length; i++) {
    if (areaC[i].checked) {
      areaC1.push(areaC[i].value);
    }
  }
  c1key = c1key.concat(areaC1);
}


function checkEventMsg(loTargetDateList){
  //毎月&指定日付のイベントを表示する
  let outStrA = "";  // 日付指定されたイベント
  let outStrB = "";  // 日のみ指定されたイベント
  let outStrC = "";  // 月のみ指定されたイベント
  let outStrD = "";  // 年・日付の指定に誤りがあるイベント
  let regex1 = /^\d{4}-\d{2}-\d{2}$|YYYY-\d{2}-\d{2}$/;  // 正規表現を使用して日付の形式を確認
  let regex2 = /^YYYY-MM-\d{2}$/;  // 正規表現を使用して日付の形式を確認
  let regex3 = /^YYYY-\d{2}-DD$/;  // 正規表現を使用して日付の形式を確認
  let currentDate = new Date();  // 現在の日付を取得
  const curYear = currentDate.getFullYear();
  const curMonth = currentDate.getMonth() + 1;
  const curDay = currentDate.getDate();

  area100Str += `${curYear}/${curMonth}/${curDay}`;
  reiwa = curYear - 2018; // 令和の年数

  currentDate.setHours(0, 0, 0, 0);

  for (let tgt = 0; tgt < loTargetDateList.length; tgt++) {
      let targetStr = loTargetDateList[tgt][0];
      let outStr = "";
      if (regex1.test(targetStr)) { // 日付が指定されている場合
          const targetDate = new Date(targetStr);
          targetStr = targetStr.replace("YYYY", curYear);
          targetDate.setHours(0, 0, 0, 0);
          outStr += `${targetDateList[tgt][2]}`;
          outStrA += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_mmdd.png");
      }else if (regex2.test(targetStr)){  // 日のみ指定されている場合
          targetStr = targetStr.replace("YYYY", curYear);
          targetStr = targetStr.replace("MM", curMonth);
          outStr += `${targetDateList[tgt][2]}`;
          outStrB += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_day.png");
      }else if (regex3.test(targetStr)){  // 月のみ指定されている場合
        targetStr = targetStr.replace("YYYY", curYear);
        targetStr = targetStr.replace("DD", curDay);
        outStr += `${targetDateList[tgt][2]}`;
        outStrC += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_month.png");
      }else{
        // イベント登録情報に誤りがあるもの
        targetStr = `${curYear}-${curMonth}-${curDay}`;
        outStr = `<B><font color="red">(${targetDateList[tgt][0]}) ${targetDateList[tgt][2]}</font></B>`;
        outStrD += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_question.png");
      }
  }
  return( outStrA + outStrC + outStrB + outStrD );
}


function makeCheckEventStr(loCurrentDate, loTargetStr, loIcon, loEventStr, loDefaultIcon){
    const targetDate = new Date(loTargetStr);
    let rtnStr = "";
    targetDate.setHours(0, 0, 0, 0);  

    if (targetDate.getTime() === loCurrentDate.getTime()) {
      let iconDir = "icon/"
      let icon = loDefaultIcon;  // デフォルトのアイコン
      if(loIcon != ""){
          icon = loIcon;  // 指定のアイコンにする
      }
      rtnStr += "<p clear='left'>";
      rtnStr += "<img src='" + iconDir + icon + "' align='left' height='22px'>";
      rtnStr += loEventStr;
      rtnStr += "</p>";
    }
    return(rtnStr);
}


function checkWeekEventMsg(loTargetWeekList){
  //毎週のイベントを表示する
  let rtnStr = "";
  let weekStr = "日月火水木金土";
  const date = new Date();
  const dayOfWeek = date.getDay();
  const dayOfWeekMaps = [];
  dayOfWeekMaps["日"] = 0;
  dayOfWeekMaps["月"] = 1;
  dayOfWeekMaps["火"] = 2;
  dayOfWeekMaps["水"] = 3;
  dayOfWeekMaps["木"] = 4;
  dayOfWeekMaps["金"] = 5;
  dayOfWeekMaps["土"] = 6;

  let todayDayOfWeek = weekStr[ dayOfWeek ];
  area100Str += ` (${todayDayOfWeek})`;

  for (let tgt = 0; tgt < loTargetWeekList.length; tgt++) {
    let pattern = new RegExp(loTargetWeekList[tgt][0]);
    let result = pattern.test(weekStr);
    let dayOfW = loTargetWeekList[tgt][0];
    let iconTarget = loTargetWeekList[tgt][1];
    let msg = loTargetWeekList[tgt][2];
    let iconDir = "icon/"
    let icon = "x_week.png";  // デフォルトのアイコン

    if(result){
      if(dayOfWeek == dayOfWeekMaps[loTargetWeekList[tgt][0]] ){
        if(iconTarget != ""){
            icon = iconTarget;  // 指定のアイコンにする
        }
        rtnStr += "<p clear='left'>";
        rtnStr += "<img src='" + iconDir + icon + "' align='left' height='22px'>";
        //rtnStr += `[${dayOfW}] ${msg}`;
        rtnStr += `[${dayOfW}] ${msg}`;
        rtnStr += "</p>";
      }
    }else{
      //入力規則に誤りがある週のイベント情報
      rtnStr += "<p clear='left'>";
      rtnStr += `<img src='${iconDir}x_question.png' align='left' height='22px'>`;
      rtnStr += `<B><font color="red">[${dayOfW}] ${msg}</font></B>`;
      rtnStr += "</p>";
    }
  }
  return(rtnStr);
}

  document.getElementById("area100").innerHTML = "<span>" + escapeHtml(area100Str) + "</span><span class='area100_original_id'>" + escapeHtml(getOriginalId()) + "</span>";
}
