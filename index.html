const LINK_VISIBILITY_STORAGE_KEY = "HTML-JavaScript-LinkLists.visibleLinkIds";

// 読み込むjsonを変数 list に追加
function getLinkStorageKey(listKey){
  return LINK_STORAGE_PREFIX + listKey;
}

function makeListKeyFromInfoId(infoId){
  return "list" + String(infoId).padStart(2, "0");
}

function makeJsonFileName(listData){
  return "links_" + String(listData["info"]["ID"]).padStart(2, "0") + ".json";
}

function isValidLinkData(linkData){
  return linkData
    && typeof linkData === "object"
    && linkData["info"]
    && typeof linkData["info"]["ID"] !== "undefined"
    && Array.isArray(linkData["list"]);
}

function getLinkDataFromStorage(listKey){
  const storedValue = storage.getItem(getLinkStorageKey(listKey));
  if(storedValue == null) return null;
  try {
    const linkData = JSON.parse(storedValue);
    return isValidLinkData(linkData) ? linkData : null;
  } catch (error) {
    console.warn("Invalid link data in Web Storage:", listKey, error);
    return null;
  }
}

function setLinkDataToStorage(listKey, linkData){
  storage.setItem(getLinkStorageKey(listKey), JSON.stringify(linkData));
}

function getAllLinkInfoIds(){
  const linkInfoIds = [];
  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const linkData = getLinkDataFromStorage(linkListKeys[keyIndex]);
    if(linkData != null){
      linkInfoIds.push(linkData["info"]["ID"]);
    }
  }
  return linkInfoIds;
}

function loadVisibleLinkIds(){
  const allLinkInfoIds = getAllLinkInfoIds();
  const storedValue = storage.getItem(LINK_VISIBILITY_STORAGE_KEY);
  if(storedValue == null){
    visibleLinkIds = allLinkInfoIds;
    return;
  }

  try {
    const storedIds = JSON.parse(storedValue);
    visibleLinkIds = Array.isArray(storedIds)
      ? storedIds.filter(infoId => allLinkInfoIds.includes(infoId))
      : allLinkInfoIds;
  } catch (error) {
    console.warn("Invalid visible link ids in Web Storage:", error);
    visibleLinkIds = allLinkInfoIds;
  }
}

function saveVisibleLinkIds(linkInfoIds){
  visibleLinkIds = linkInfoIds;
  storage.setItem(LINK_VISIBILITY_STORAGE_KEY, JSON.stringify(visibleLinkIds));
}

function isLinkInfoVisible(linkInfoId){
  return visibleLinkIds.includes(linkInfoId);
}

function loadAreaBVisibleLinkIds(){
  const storedValue = storage.getItem(AREA_B_VISIBILITY_STORAGE_KEY);
  if(storedValue == null){
    b1key = b1key.concat(visibleLinkIds);
    isAreaBFilterActive = true;
    return;
  }

  try {
    const storedIds = JSON.parse(storedValue);
    b1key = Array.isArray(storedIds)
      ? b1key.concat(storedIds.filter(infoId => visibleLinkIds.includes(infoId)))
      : b1key.concat(visibleLinkIds);
  } catch (error) {
    console.warn("Invalid AreaB visible link ids in Web Storage:", error);
    b1key = b1key.concat(visibleLinkIds);
  }
  isAreaBFilterActive = true;
}

function refreshLoadArrFromStorage(){
  load_arr.length = 0;
  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const linkData = getLinkDataFromStorage(linkListKeys[keyIndex]);
    if(linkData != null){
      load_arr.push(linkData);
    }
  }
}

function refreshAllAreas(){
  set_Initial();
  refreshLoadArrFromStorage();
  loadVisibleLinkIds();
  loadAreaBVisibleLinkIds();
  set_List();
  showAreaB();
  showAreaC(0);
  showAreaD();
}

function importLinkJsonFiles(files){
  const fileList = Array.from(files);
  const readers = fileList.map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const linkData = JSON.parse(reader.result);
        if(!isValidLinkData(linkData)){
          throw new Error("invalid link json");
        }
        const listKey = makeListKeyFromInfoId(linkData["info"]["ID"]);
        setLinkDataToStorage(listKey, linkData);
        resolve({"fileName": file.name, "infoId": linkData["info"]["ID"]});
      } catch (error) {
        reject(new Error(file.name + ": " + error.message));
      }
    };
    reader.onerror = () => reject(new Error(file.name + ": file read error"));
    reader.readAsText(file);
  }));

  Promise.all(readers)
    .then(importedFiles => {
      loadVisibleLinkIds();
      const importedInfoIds = importedFiles.map(importedFile => importedFile["infoId"]);
      saveVisibleLinkIds(Array.from(new Set(visibleLinkIds.concat(importedInfoIds))));
      b1key.length = 0;
      loadAreaBVisibleLinkIds();
      storage.setItem(AREA_B_VISIBILITY_STORAGE_KEY, JSON.stringify(Array.from(new Set(b1key.concat(importedInfoIds)))));
      refreshAllAreas();
      alert(importedFiles.length + " file(s) imported.");
    })
    .catch(error => {
      alert("Import failed. " + error.message);
    });
}

function downloadTextFile(fileName, fileContent, contentType){
  const blob = new Blob([fileContent], {type: contentType});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportAllLinkJsonFiles(){
  refreshLoadArrFromStorage();
  if(load_arr.length == 0){
    alert("No link data in Web Storage.");
    return;
  }
  for(let linkIndex = 0; linkIndex < load_arr.length; linkIndex++){
    const linkData = load_arr[linkIndex];
    downloadTextFile(makeJsonFileName(linkData), JSON.stringify(linkData, null, 2), "application/json");
  }
}

function set_List(){
  list.length = 0;
  listinfo.length = 0;
  for(let lp=0; lp < load_arr.length; lp++){
    const linkInfoId = load_arr[lp]["info"]["ID"];
    if (visibleLinkIds.includes(linkInfoId) && (!isAreaBFilterActive || b1key.includes(linkInfoId))) {
      list = list.concat(load_arr[lp]["list"]);
      listinfo = listinfo.concat(load_arr[lp]["info"]);
    }
  }
}

  // rFlg 初期化

  for (let i = 0; i < c1key.length; i++) {

  }

  for (let i = 0; i < c1key.length; i++) {
    rtn = 0;
    tmpKey = c1key[i].toLowerCase(); // 小文字変換

    }

  // AND検索
  ctn = 1;
  for (let i = 0; i < rFlg.length; i++) {
    ctn *= rFlg[i];
  }
  return(ctn);
}

    isSelected = setSelectFlg( list[lp0]["icon"], list[lp0]["Name"], list[lp0]["URL"], cateStr, list[lp0]["note"], decoUrl );

    if(isSelected == 1)
    {
      if( hiraToKana(list[lp0]["kana"][0].toUpperCase()).normalize('NFD')[0] != hiraToKana(headStr.toUpperCase()).normalize('NFD')[0]){
        headStr = list[lp0]["kana"][0];
        let headingText = hiraToKana( headStr.toUpperCase() );
        headingText = headingText.normalize('NFD')[0];  // 濁音→静音
        wStr += "<div class='div_f0'>";
        wStr += "<B>" + headingText + "</B>";
        wStr += "</div>"
      }

      wStr += "<div class='div_f1'>";
      wStr += "<a href='"+ list[lp0]["URL"] +"' target='_blank' rel='noopener noreferrer'>";

      // アイコン情報あれば表示
      if(typeof list[lp0]["icon"] !== 'undefined'){
        wStr += "<img src='icon/"+ list[lp0]["icon"] +"' height='70' align='middle' hspace='3px' vspace='3px'>";
      }
      wStr += list[lp0]["Name"];
      wStr += "</a>";
      wStr += "<small>";
      wStr += "<div class='div_url'>";
      wStr += decoUrl;
      wStr += "</div>";
      wStr += "<hr width='100%'>";

      // note の改行(\n)を数えて textarea タグの高さを設定する
      let noteRows = ( list[lp0]["note"].match( /\n/g ) || [] ).length + 2 ;
      // console.log("noteRows = " + noteRows + ", note = " + list[lp0]["note"]);
      wStr += "<textarea rows='"+ noteRows +"'>";
      wStr += list[lp0]["note"];
      wStr += "</textarea><BR />";

      wStr += cateStr;
      wStr += "</small>";
      wStr += "</div>";
    }
  }
  if(wStr.length <= 0) wStr = "ヒット 0 件";
  document.getElementById("areaD").innerHTML = wStr;
}

function set_C1key_B1key(){
  const toElementArray = (elements) => elements == null ? [] : (typeof elements.length === "number" ? Array.from(elements) : [elements]);
  const areaB1 = [];
  const areaB  = toElementArray(document.areaB.areaB1);
  const areaC1 = [];
  const areaC  = toElementArray(document.areaC.areaC1);

  isAreaBFilterActive = areaB.length > 0;
  for (let i = 0; i < areaB.length; i++) {
    if (areaB[i].checked) {
      areaB1.push(areaB[i].value);
    }
  }
  b1key = b1key.concat(areaB1);

  // 検索欄の文字列をc1keyに格納する
  keyStr = document.getElementById("inputKey").value;

  if(keyStr.length > 0)
  {
    keyStr = keyStr.replace(/　/g, ' ');  // 全角空白→半角空白
    keyStr = keyStr.replace(/,/g, ' ');   // , (コロン)→半角空白
    keyStr = keyStr.replace(/\\/g, ' ');  // ￥ →半角空白
    keyStr = keyStr.toLowerCase();        // 小文字変換
    iptkey = keyStr.split(" ");           // 検索欄の文字列を半角空白で分割し配列に格納    
    c1key.length = 0;
    for (let i = 0; i < iptkey.length; i++) {
      c1key.push(iptkey[i]);
    }
  }

  for (let i = 0; i < areaC.length; i++) {
    if (areaC[i].checked) {
      areaC1.push(areaC[i].value);
    }
  }
  c1key = c1key.concat(areaC1);
}


function checkEventMsg(loTargetDateList){
  //毎月&指定日付のイベントを表示する
  let outStrA = "";  // 日付指定されたイベント
  let outStrB = "";  // 日のみ指定されたイベント
  let outStrC = "";  // 月のみ指定されたイベント
  let outStrD = "";  // 年・日付の指定に誤りがあるイベント
  let regex1 = /^\d{4}-\d{2}-\d{2}$|YYYY-\d{2}-\d{2}$/;  // 正規表現を使用して日付の形式を確認
  let regex2 = /^YYYY-MM-\d{2}$/;  // 正規表現を使用して日付の形式を確認
  let regex3 = /^YYYY-\d{2}-DD$/;  // 正規表現を使用して日付の形式を確認
  let currentDate = new Date();  // 現在の日付を取得
  const curYear = currentDate.getFullYear();
  const curMonth = currentDate.getMonth() + 1;
  const curDay = currentDate.getDate();

  area100Str += `${curYear}/${curMonth}/${curDay}`;
  reiwa = curYear - 2018; // 令和の年数

  currentDate.setHours(0, 0, 0, 0);

  for (let tgt = 0; tgt < loTargetDateList.length; tgt++) {
      let targetStr = loTargetDateList[tgt][0];
      let outStr = "";
      if (regex1.test(targetStr)) { // 日付が指定されている場合
          const targetDate = new Date(targetStr);
          targetStr = targetStr.replace("YYYY", curYear);
          targetDate.setHours(0, 0, 0, 0);
          outStr += `${targetDateList[tgt][2]}`;
          outStrA += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_mmdd.png");
      }else if (regex2.test(targetStr)){  // 日のみ指定されている場合
          targetStr = targetStr.replace("YYYY", curYear);
          targetStr = targetStr.replace("MM", curMonth);
          outStr += `${targetDateList[tgt][2]}`;
          outStrB += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_day.png");
      }else if (regex3.test(targetStr)){  // 月のみ指定されている場合
        targetStr = targetStr.replace("YYYY", curYear);
        targetStr = targetStr.replace("DD", curDay);
        outStr += `${targetDateList[tgt][2]}`;
        outStrC += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_month.png");
      }else{
        // イベント登録情報に誤りがあるもの
        targetStr = `${curYear}-${curMonth}-${curDay}`;
        outStr = `<B><font color="red">(${targetDateList[tgt][0]}) ${targetDateList[tgt][2]}</font></B>`;
        outStrD += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_question.png");
      }
  }
  return( outStrA + outStrC + outStrB + outStrD );
}


function makeCheckEventStr(loCurrentDate, loTargetStr, loIcon, loEventStr, loDefaultIcon){
    const targetDate = new Date(loTargetStr);
    let rtnStr = "";
    targetDate.setHours(0, 0, 0, 0);  

    if (targetDate.getTime() === loCurrentDate.getTime()) {
      let iconDir = "icon/"
      let icon = loDefaultIcon;  // デフォルトのアイコン
      if(loIcon != ""){
          icon = loIcon;  // 指定のアイコンにする
      }
      rtnStr += "<p clear='left'>";
      rtnStr += "<img src='" + iconDir + icon + "' align='left' height='22px'>";
      rtnStr += loEventStr;
      rtnStr += "</p>";
    }
    return(rtnStr);
}


function checkWeekEventMsg(loTargetWeekList){
  //毎週のイベントを表示する
  let rtnStr = "";
  let weekStr = "日月火水木金土";
  const date = new Date();
  const dayOfWeek = date.getDay();
  const dayOfWeekMaps = [];
  dayOfWeekMaps["日"] = 0;
  dayOfWeekMaps["月"] = 1;
  dayOfWeekMaps["火"] = 2;
  dayOfWeekMaps["水"] = 3;
  dayOfWeekMaps["木"] = 4;
  dayOfWeekMaps["金"] = 5;
  dayOfWeekMaps["土"] = 6;

  let todayDayOfWeek = weekStr[ dayOfWeek ];
  area100Str += ` (${todayDayOfWeek})`;

  for (let tgt = 0; tgt < loTargetWeekList.length; tgt++) {
    let pattern = new RegExp(loTargetWeekList[tgt][0]);
    let result = pattern.test(weekStr);
    let dayOfW = loTargetWeekList[tgt][0];
    let iconTarget = loTargetWeekList[tgt][1];
    let msg = loTargetWeekList[tgt][2];
    let iconDir = "icon/"
    let icon = "x_week.png";  // デフォルトのアイコン

    if(result){
      if(dayOfWeek == dayOfWeekMaps[loTargetWeekList[tgt][0]] ){
        if(iconTarget != ""){
            icon = iconTarget;  // 指定のアイコンにする
        }
        rtnStr += "<p clear='left'>";
        rtnStr += "<img src='" + iconDir + icon + "' align='left' height='22px'>";
        //rtnStr += `[${dayOfW}] ${msg}`;
        rtnStr += `[${dayOfW}] ${msg}`;
        rtnStr += "</p>";
      }
    }else{
      //入力規則に誤りがある週のイベント情報
      rtnStr += "<p clear='left'>";
      rtnStr += `<img src='${iconDir}x_question.png' align='left' height='22px'>`;
      rtnStr += `<B><font color="red">[${dayOfW}] ${msg}</font></B>`;
      rtnStr += "</p>";
    }
  }
  return(rtnStr);
}

}
