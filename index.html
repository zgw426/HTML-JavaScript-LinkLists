//---- ↓↓ 左側に表示するリストの設定 ↓↓ ----//

const storage = localStorage;
const LINK_STORAGE_PREFIX = "HTML-JavaScript-LinkLists.links.";
const LINK_VISIBILITY_STORAGE_KEY = "HTML-JavaScript-LinkLists.visibleLinkIds";
const AREA_B_VISIBILITY_STORAGE_KEY = "HTML-JavaScript-LinkLists.areaBVisibleLinkIds";
const ENHANCEMENT_STORAGE_KEY = "HTML-JavaScript-LinkLists.functionEnhancement";
const OPERATION_LOG_STORAGE_KEY = "HTML-JavaScript-LinkLists.operationLog";
const DEFAULT_ORIGINAL_ID = "HTML-JavaScript-LinkLists";
const DEFAULT_OPERATION_LOG_MAX = 100;
const linkListKeys = ["list01","list02","list03","list04","list05","list06","list07","list08","list09","list10"];
let load_arr = [];
//let linkListKeys = ["list01","list02","list03","list05"];

//---- ↑↑ 左側に表示するリストの設定 ↑↑ ----//


let list = [];
let listinfo = [];
let visibleLinkIds = [];
let isAreaBFilterActive = false;
let b1key  = new Array();  // list02_infoの情報
let c1key  = new Array();  // categoryの情報
let iptkey = new Array();  // 検索欄の情報
let icons = new Array();  // 画像ファイル名
let area100Str = "";
let reiwa = ""; // 令和の年数


// 読み込むjsonを変数 list に追加
function getLinkStorageKey(listKey){
  return LINK_STORAGE_PREFIX + listKey;
}

function makeListKeyFromInfoId(infoId){
  return "list" + String(infoId).padStart(2, "0");
}

function makeJsonFileName(listData){
  return "links_" + String(listData["info"]["ID"]).padStart(2, "0") + ".json";
}

function isValidLinkData(linkData){
  return linkData
    && typeof linkData === "object"
    && linkData["info"]
    && typeof linkData["info"]["ID"] !== "undefined"
    && Array.isArray(linkData["list"]);
}

function getLinkDataFromStorage(listKey){
  const storedValue = storage.getItem(getLinkStorageKey(listKey));
  if(storedValue == null) return null;
  try {
    const linkData = JSON.parse(storedValue);
    return isValidLinkData(linkData) ? linkData : null;
  } catch (error) {
    console.warn("Invalid link data in Web Storage:", listKey, error);
    return null;
  }
}

function setLinkDataToStorage(listKey, linkData){
  storage.setItem(getLinkStorageKey(listKey), JSON.stringify(linkData));
}

function getObjectFromKeyedArray(keyedArray){
  const object = {};
  for(let key in keyedArray){
    object[key] = keyedArray[key];
  }
  return object;
}

function replaceKeyedArrayValues(keyedArray, sourceObject){
  for(let key in keyedArray){
    delete keyedArray[key];
  }
  for(let key in sourceObject){
    keyedArray[key] = sourceObject[key];
  }
}

function replaceListValues(targetList, sourceList){
  targetList.length = 0;
  for(let index = 0; index < sourceList.length; index++){
    targetList.push(sourceList[index]);
  }
}

function makeEnhancementDataFromGlobals(){
  return {
    "type": "function_enhancement",
    "key_highlight": getObjectFromKeyedArray(key_highlight),
    "key_icon": getObjectFromKeyedArray(key_icon),
    "targetDateList": targetDateList,
    "targetWeekList": targetWeekList,
    "originalId": typeof originalId === "undefined" ? DEFAULT_ORIGINAL_ID : originalId,
    "operationLogMax": typeof operationLogMax === "undefined" ? DEFAULT_OPERATION_LOG_MAX : operationLogMax
  };
}

function isValidEnhancementData(enhancementData){
  return enhancementData
    && typeof enhancementData === "object"
    && typeof enhancementData["key_highlight"] === "object"
    && typeof enhancementData["key_icon"] === "object"
    && Array.isArray(enhancementData["targetDateList"])
    && Array.isArray(enhancementData["targetWeekList"]);
}

function getEnhancementDataFromStorage(){
  const storedValue = storage.getItem(ENHANCEMENT_STORAGE_KEY);
  if(storedValue == null) return null;
  try {
    const enhancementData = JSON.parse(storedValue);
    return isValidEnhancementData(enhancementData) ? enhancementData : null;
  } catch (error) {
    console.warn("Invalid function enhancement data in Web Storage:", error);
    return null;
  }
}

function setEnhancementDataToStorage(enhancementData){
  enhancementData["originalId"] = getValidatedOriginalId(enhancementData["originalId"]);
  enhancementData["operationLogMax"] = getValidatedOperationLogMax(enhancementData["operationLogMax"]);
  storage.setItem(ENHANCEMENT_STORAGE_KEY, JSON.stringify(enhancementData));
  saveOperationLogs(getOperationLogs());
}

function applyEnhancementData(enhancementData){
  replaceKeyedArrayValues(key_highlight, enhancementData["key_highlight"]);
  replaceKeyedArrayValues(key_icon, enhancementData["key_icon"]);
  replaceListValues(targetDateList, enhancementData["targetDateList"]);
  replaceListValues(targetWeekList, enhancementData["targetWeekList"]);
}

function loadEnhancementDataFromStorage(){
  let enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    enhancementData = makeEnhancementDataFromGlobals();
    setEnhancementDataToStorage(enhancementData);
  }
  applyEnhancementData(enhancementData);
}

function makeEnhancementJsonFileName(){
  return "function_enhancement.json";
}

function getValidatedOriginalId(value){
  const originalIdValue = String(value == null ? "" : value).trim();
  return originalIdValue == "" ? DEFAULT_ORIGINAL_ID : originalIdValue;
}

function getOriginalId(){
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    return DEFAULT_ORIGINAL_ID;
  }

  return getValidatedOriginalId(enhancementData["originalId"]);
}

function getValidatedOperationLogMax(value){
  const operationLogMax = Number(value);
  if(Number.isFinite(operationLogMax) && operationLogMax >= 0){
    return Math.floor(operationLogMax);
  }

  return DEFAULT_OPERATION_LOG_MAX;
}

function getOperationLogMax(){
  const enhancementData = getEnhancementDataFromStorage();
  if(enhancementData == null){
    return DEFAULT_OPERATION_LOG_MAX;
  }

  return getValidatedOperationLogMax(enhancementData["operationLogMax"]);
}

function getOperationLogs(){
  const storedValue = storage.getItem(OPERATION_LOG_STORAGE_KEY);
  if(storedValue == null){
    return [];
  }

  try {
    const operationLogs = JSON.parse(storedValue);
    return Array.isArray(operationLogs) ? operationLogs : [];
  } catch (error) {
    console.warn("Invalid operation log data in Web Storage:", error);
    return [];
  }
}

function saveOperationLogs(operationLogs){
  const operationLogMax = getOperationLogMax();
  const trimmedLogs = operationLogMax == 0
    ? []
    : operationLogs.slice(Math.max(operationLogs.length - operationLogMax, 0));
  storage.setItem(OPERATION_LOG_STORAGE_KEY, JSON.stringify(trimmedLogs));
}

function getWeekdayText(date){
  return ["日","月","火","水","木","金","土"][date.getDay()];
}

function getOperationLogWeekday(operationLog){
  if(operationLog["weekday"]){
    return operationLog["weekday"];
  }
  if(operationLog["datetime"]){
    return getWeekdayText(new Date(operationLog["datetime"]));
  }
  return "";
}

function recordOperationLog(action, detail){
  const logDate = new Date();
  const operationLogs = getOperationLogs();
  operationLogs.push({
    "datetime": logDate.toISOString(),
    "weekday": getWeekdayText(logDate),
    "action": action,
    "detail": detail
  });
  saveOperationLogs(operationLogs);
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escapeCsvValue(value){
  return '"' + String(value == null ? "" : value).replace(/"/g, '""') + '"';
}

function exportOperationLogCsv(){
  const operationLogs = getOperationLogs();
  let csvText = "\uFEFF";
  csvText += ["datetime", "weekday", "action", "detail"].map(escapeCsvValue).join(",") + "\r\n";

  for(let logIndex = 0; logIndex < operationLogs.length; logIndex++){
    const operationLog = operationLogs[logIndex];
    csvText += [
      operationLog["datetime"] || "",
      getOperationLogWeekday(operationLog),
      operationLog["action"] || "",
      operationLog["detail"] || ""
    ].map(escapeCsvValue).join(",") + "\r\n";
  }

  downloadTextFile(makeOperationLogCsvFileName(operationLogs), csvText, "text/csv");
}

function padNumber(value, length){
  return String(value).padStart(length, "0");
}

function formatLogDateTime(dateTimeText){
  const date = dateTimeText ? new Date(dateTimeText) : new Date();
  const validDate = Number.isNaN(date.getTime()) ? new Date() : date;
  return validDate.getFullYear()
    + "-" + padNumber(validDate.getMonth() + 1, 2)
    + "-" + padNumber(validDate.getDate(), 2)
    + "_" + padNumber(validDate.getHours(), 2)
    + "-" + padNumber(validDate.getMinutes(), 2)
    + "-" + padNumber(validDate.getSeconds(), 2);
}

function sanitizeFileNamePart(value){
  return String(value).replace(/[\\/:*?"<>|]/g, "_");
}

function makeOperationLogCsvFileName(operationLogs){
  const firstLog = operationLogs.length > 0 ? operationLogs[0] : null;
  const lastLog = operationLogs.length > 0 ? operationLogs[operationLogs.length - 1] : null;
  return sanitizeFileNamePart(getOriginalId())
    + "__" + formatLogDateTime(firstLog == null ? "" : firstLog["datetime"])
    + "__" + formatLogDateTime(lastLog == null ? "" : lastLog["datetime"])
    + "__" + padNumber(operationLogs.length, 7)
    + ".csv";
}

function getAllLinkInfoIds(){
  const linkInfoIds = [];
  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const linkData = getLinkDataFromStorage(linkListKeys[keyIndex]);
    if(linkData != null){
      linkInfoIds.push(linkData["info"]["ID"]);
    }
  }
  return linkInfoIds;
}

function loadVisibleLinkIds(){
  const allLinkInfoIds = getAllLinkInfoIds();
  const storedValue = storage.getItem(LINK_VISIBILITY_STORAGE_KEY);
  if(storedValue == null){
    visibleLinkIds = allLinkInfoIds;
    return;
  }

  try {
    const storedIds = JSON.parse(storedValue);
    visibleLinkIds = Array.isArray(storedIds)
      ? storedIds.filter(infoId => allLinkInfoIds.includes(infoId))
      : allLinkInfoIds;
  } catch (error) {
    console.warn("Invalid visible link ids in Web Storage:", error);
    visibleLinkIds = allLinkInfoIds;
  }
}

function saveVisibleLinkIds(linkInfoIds){
  visibleLinkIds = linkInfoIds;
  storage.setItem(LINK_VISIBILITY_STORAGE_KEY, JSON.stringify(visibleLinkIds));
}

function isLinkInfoVisible(linkInfoId){
  return visibleLinkIds.includes(linkInfoId);
}

function loadAreaBVisibleLinkIds(){
  const storedValue = storage.getItem(AREA_B_VISIBILITY_STORAGE_KEY);
  if(storedValue == null){
    b1key = b1key.concat(visibleLinkIds);
    isAreaBFilterActive = true;
    return;
  }

  try {
    const storedIds = JSON.parse(storedValue);
    b1key = Array.isArray(storedIds)
      ? b1key.concat(storedIds.filter(infoId => visibleLinkIds.includes(infoId)))
      : b1key.concat(visibleLinkIds);
  } catch (error) {
    console.warn("Invalid AreaB visible link ids in Web Storage:", error);
    b1key = b1key.concat(visibleLinkIds);
  }
  isAreaBFilterActive = true;
}

function refreshLoadArrFromStorage(){
  load_arr.length = 0;
  for(let keyIndex = 0; keyIndex < linkListKeys.length; keyIndex++){
    const linkData = getLinkDataFromStorage(linkListKeys[keyIndex]);
    if(linkData != null){
      load_arr.push(linkData);
    }
  }
}

function refreshAllAreas(){
  set_Initial();
  loadEnhancementDataFromStorage();
  refreshLoadArrFromStorage();
  loadVisibleLinkIds();
  loadAreaBVisibleLinkIds();
  set_List();
  showAreaB();
  showAreaC(0);
  showAreaD();
}

function getLinkItemDuplicateKey(linkItem){
  return String(linkItem["Name"] || "") + "\u0001" + String(linkItem["URL"] || "");
}

function appendImportedNote(registeredNote, importedNote){
  if(importedNote == null || importedNote == ""){
    return registeredNote || "";
  }
  if(registeredNote == null || registeredNote == ""){
    return importedNote;
  }
  return registeredNote + "\n" + importedNote;
}

function mergeLinkData(registeredLinkData, importedLinkData, duplicateStrategy){
  const mergedLinkData = {
    "info": registeredLinkData["info"],
    "list": []
  };
  const importedItemByDuplicateKey = {};

  for(let importedIndex = 0; importedIndex < importedLinkData["list"].length; importedIndex++){
    const importedItem = importedLinkData["list"][importedIndex];
    importedItemByDuplicateKey[getLinkItemDuplicateKey(importedItem)] = importedItem;
  }

  for(let registeredIndex = 0; registeredIndex < registeredLinkData["list"].length; registeredIndex++){
    const registeredItem = registeredLinkData["list"][registeredIndex];
    const duplicateKey = getLinkItemDuplicateKey(registeredItem);
    const importedItem = importedItemByDuplicateKey[duplicateKey];

    if(typeof importedItem === "undefined"){
      mergedLinkData["list"].push(registeredItem);
      continue;
    }

    if(duplicateStrategy == "overwrite"){
      mergedLinkData["list"].push(importedItem);
    }else if(duplicateStrategy == "appendNote"){
      const mergedItem = Object.assign({}, registeredItem);
      mergedItem["note"] = appendImportedNote(registeredItem["note"], importedItem["note"]);
      mergedLinkData["list"].push(mergedItem);
    }else{
      mergedLinkData["list"].push(registeredItem);
    }

    delete importedItemByDuplicateKey[duplicateKey];
  }

  for(let importedIndex = 0; importedIndex < importedLinkData["list"].length; importedIndex++){
    const importedItem = importedLinkData["list"][importedIndex];
    const duplicateKey = getLinkItemDuplicateKey(importedItem);
    if(typeof importedItemByDuplicateKey[duplicateKey] !== "undefined"){
      mergedLinkData["list"].push(importedItem);
      delete importedItemByDuplicateKey[duplicateKey];
    }
  }

  return mergedLinkData;
}

function getLinkImportOptions(hasExistingLinkData){
  const importOptions = {
    "mode": "overwrite",
    "duplicateStrategy": "keepRegistered"
  };

  if(!hasExistingLinkData){
    return Promise.resolve(importOptions);
  }

  return new Promise(resolve => {
    const dialogOverlay = document.createElement("div");
    dialogOverlay.style.position = "fixed";
    dialogOverlay.style.top = "0";
    dialogOverlay.style.left = "0";
    dialogOverlay.style.width = "100%";
    dialogOverlay.style.height = "100%";
    dialogOverlay.style.backgroundColor = "rgba(0, 0, 0, 0.35)";
    dialogOverlay.style.zIndex = "1000";

    const dialogPanel = document.createElement("div");
    dialogPanel.style.backgroundColor = "#ffffff";
    dialogPanel.style.border = "solid 1px #444444";
    dialogPanel.style.margin = "80px auto";
    dialogPanel.style.padding = "16px";
    dialogPanel.style.width = "min(520px, calc(100% - 40px))";

    dialogPanel.innerHTML = ""
      + "<h3>リンクJSON取込</h3>"
      + "<p>すでにWebストレージに登録されているリンク情報があります。</p>"
      + "<label>取込方法 "
      + "<select id='linkImportModeSelect'>"
      + "<option value='overwrite'>上書き</option>"
      + "<option value='merge'>マージ</option>"
      + "</select>"
      + "</label>"
      + "<div id='linkImportDuplicateStrategyArea' style='display:none; margin-top:12px;'>"
      + "<label>重複時の扱い "
      + "<select id='linkImportDuplicateStrategySelect'>"
      + "<option value='keepRegistered'>登録されているデータのみ残す</option>"
      + "<option value='overwrite'>インポートするデータで上書きする</option>"
      + "<option value='appendNote'>登録されているデータの note に、インポートするデータの note を追記する</option>"
      + "</select>"
      + "</label>"
      + "</div>"
      + "<div style='margin-top:16px; text-align:right;'>"
      + "<input type='button' id='linkImportCancelButton' value='キャンセル' /> "
      + "<input type='button' id='linkImportOkButton' value='取込' />"
      + "</div>";

    dialogOverlay.appendChild(dialogPanel);
    document.body.appendChild(dialogOverlay);

    const modeSelect = document.getElementById("linkImportModeSelect");
    const duplicateStrategyArea = document.getElementById("linkImportDuplicateStrategyArea");
    const duplicateStrategySelect = document.getElementById("linkImportDuplicateStrategySelect");
    const closeDialog = (selectedOptions) => {
      document.body.removeChild(dialogOverlay);
      resolve(selectedOptions);
    };

    modeSelect.onchange = () => {
      duplicateStrategyArea.style.display = modeSelect.value == "merge" ? "block" : "none";
    };
    document.getElementById("linkImportCancelButton").onclick = () => closeDialog(null);
    document.getElementById("linkImportOkButton").onclick = () => closeDialog({
      "mode": modeSelect.value,
      "duplicateStrategy": duplicateStrategySelect.value
    });
  });
}

function importLinkJsonFiles(files){
  const fileList = Array.from(files);
  const readers = fileList.map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const jsonData = JSON.parse(reader.result);
        resolve({"fileName": file.name, "jsonData": jsonData});
      } catch (error) {
        reject(new Error(file.name + ": " + error.message));
      }
    };
    reader.onerror = () => reject(new Error(file.name + ": file read error"));
    reader.readAsText(file);
  }));

  Promise.all(readers)
    .then(async importedJsonFiles => {
      const hasExistingLinkData = importedJsonFiles.some(importedJsonFile => {
        const jsonData = importedJsonFile["jsonData"];
        return isValidLinkData(jsonData) && getLinkDataFromStorage(makeListKeyFromInfoId(jsonData["info"]["ID"])) != null;
      });
      const importOptions = await getLinkImportOptions(hasExistingLinkData);
      if(importOptions == null){
        return;
      }

      const importedFiles = [];
      for(let importedFileIndex = 0; importedFileIndex < importedJsonFiles.length; importedFileIndex++){
        const importedJsonFile = importedJsonFiles[importedFileIndex];
        const jsonData = importedJsonFile["jsonData"];
        if(isValidLinkData(jsonData)){
          const listKey = makeListKeyFromInfoId(jsonData["info"]["ID"]);
          const registeredLinkData = getLinkDataFromStorage(listKey);
          if(importOptions["mode"] == "merge" && registeredLinkData != null){
            setLinkDataToStorage(listKey, mergeLinkData(registeredLinkData, jsonData, importOptions["duplicateStrategy"]));
          }else{
            setLinkDataToStorage(listKey, jsonData);
          }
          importedFiles.push({"fileName": importedJsonFile["fileName"], "kind": "link", "infoId": jsonData["info"]["ID"]});
          continue;
        }
        if(isValidEnhancementData(jsonData)){
          setEnhancementDataToStorage(jsonData);
          applyEnhancementData(jsonData);
          importedFiles.push({"fileName": importedJsonFile["fileName"], "kind": "enhancement"});
          continue;
        }
        throw new Error(importedJsonFile["fileName"] + ": invalid json");
      }

      for(let importedFileIndex = 0; importedFileIndex < importedFiles.length; importedFileIndex++){
        recordOperationLog("JSON取込", importedFiles[importedFileIndex]["fileName"]);
      }
      const importedInfoIds = importedFiles
        .filter(importedFile => importedFile["kind"] == "link")
        .map(importedFile => importedFile["infoId"]);
      if(importedInfoIds.length > 0){
        loadVisibleLinkIds();
        saveVisibleLinkIds(Array.from(new Set(visibleLinkIds.concat(importedInfoIds))));
        b1key.length = 0;
        loadAreaBVisibleLinkIds();
        storage.setItem(AREA_B_VISIBILITY_STORAGE_KEY, JSON.stringify(Array.from(new Set(b1key.concat(importedInfoIds)))));
      }
      refreshAllAreas();
      alert(importedFiles.length + " file(s) imported.");
    })
    .catch(error => {
      alert("Import failed. " + error.message);
    });
}

function downloadTextFile(fileName, fileContent, contentType){
  const blob = new Blob([fileContent], {type: contentType});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportAllLinkJsonFiles(){
  refreshLoadArrFromStorage();
  const enhancementData = getEnhancementDataFromStorage();
  if(load_arr.length == 0 && enhancementData == null){
    alert("No data in Web Storage.");
    return;
  }
  for(let linkIndex = 0; linkIndex < load_arr.length; linkIndex++){
    const linkData = load_arr[linkIndex];
    const fileName = makeJsonFileName(linkData);
    downloadTextFile(fileName, JSON.stringify(linkData, null, 2), "application/json");
    recordOperationLog("JSON出力", fileName);
  }
  if(enhancementData != null){
    const fileName = makeEnhancementJsonFileName();
    downloadTextFile(fileName, JSON.stringify(enhancementData, null, 2), "application/json");
    recordOperationLog("JSON出力", fileName);
  }
}

function set_List(){
  list.length = 0;
  listinfo.length = 0;
  for(let lp=0; lp < load_arr.length; lp++){
    const linkInfoId = load_arr[lp]["info"]["ID"];
    if (visibleLinkIds.includes(linkInfoId) && (!isAreaBFilterActive || b1key.includes(linkInfoId))) {
      list = list.concat(load_arr[lp]["list"]);
      listinfo = listinfo.concat(load_arr[lp]["info"]);
    }
  }
}
</script>

    });

function checkEventMsg(loTargetDateList){
  //毎月&指定日付のイベントを表示する
  let outStrA = "";  // 日付指定されたイベント
  let outStrB = "";  // 日のみ指定されたイベント
  let outStrC = "";  // 月のみ指定されたイベント
  let outStrD = "";  // 年・日付の指定に誤りがあるイベント
  let regex1 = /^\d{4}-\d{2}-\d{2}$|YYYY-\d{2}-\d{2}$/;  // 正規表現を使用して日付の形式を確認
  let regex2 = /^YYYY-MM-\d{2}$/;  // 正規表現を使用して日付の形式を確認
  let regex3 = /^YYYY-\d{2}-DD$/;  // 正規表現を使用して日付の形式を確認
  let currentDate = new Date();  // 現在の日付を取得
  const curYear = currentDate.getFullYear();
  const curMonth = currentDate.getMonth() + 1;
  const curDay = currentDate.getDate();

  area100Str += `${curYear}/${curMonth}/${curDay}`;
  reiwa = curYear - 2018; // 令和の年数

  currentDate.setHours(0, 0, 0, 0);

  for (let tgt = 0; tgt < loTargetDateList.length; tgt++) {
      let targetStr = loTargetDateList[tgt][0];
      let outStr = "";
      if (regex1.test(targetStr)) { // 日付が指定されている場合
          const targetDate = new Date(targetStr);
          targetStr = targetStr.replace("YYYY", curYear);
          targetDate.setHours(0, 0, 0, 0);
          outStr += `${targetDateList[tgt][2]}`;
          outStrA += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_mmdd.png");
      }else if (regex2.test(targetStr)){  // 日のみ指定されている場合
          targetStr = targetStr.replace("YYYY", curYear);
          targetStr = targetStr.replace("MM", curMonth);
          outStr += `${targetDateList[tgt][2]}`;
          outStrB += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_day.png");
      }else if (regex3.test(targetStr)){  // 月のみ指定されている場合
        targetStr = targetStr.replace("YYYY", curYear);
        targetStr = targetStr.replace("DD", curDay);
        outStr += `${targetDateList[tgt][2]}`;
        outStrC += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_month.png");
      }else{
        // イベント登録情報に誤りがあるもの
        targetStr = `${curYear}-${curMonth}-${curDay}`;
        outStr = `<B><font color="red">(${targetDateList[tgt][0]}) ${targetDateList[tgt][2]}</font></B>`;
        outStrD += makeCheckEventStr(currentDate, targetStr, targetDateList[tgt][1], outStr,"x_question.png");
      }
  }
  return( outStrA + outStrC + outStrB + outStrD );
}

        }
        rtnStr += "<p clear='left'>";
        rtnStr += "<img src='" + iconDir + icon + "' align='left' height='22px'>";
        //rtnStr += `[${dayOfW}] ${msg}`;
        rtnStr += `[${dayOfW}] ${msg}`;
        rtnStr += "</p>";
      }
    }else{
      //入力規則に誤りがある週のイベント情報
      rtnStr += "<p clear='left'>";
      rtnStr += `<img src='${iconDir}x_question.png' align='left' height='22px'>`;
      rtnStr += `<B><font color="red">[${dayOfW}] ${msg}</font></B>`;
      rtnStr += "</p>";
    }
  }
  return(rtnStr);
}


function showArea100(){
  area100Str += `  令和${reiwa}年`;
  document.getElementById("area100").innerHTML = area100Str;
}
